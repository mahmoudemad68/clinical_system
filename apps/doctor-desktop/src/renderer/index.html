<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Clinic Doctor</title>
    <!--
      The main process sets the authoritative CSP on every response. This meta
      tag is a second line for the packaged document itself, so a missing
      response header cannot silently relax the policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' clinic-doctor-app:; style-src 'self' clinic-doctor-app: 'unsafe-inline'; img-src 'self' clinic-doctor-app: data:; font-src 'self' clinic-doctor-app: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
