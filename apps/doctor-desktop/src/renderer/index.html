<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Clinic Doctor</title>
    <!--
      Packaged documents keep a CSP meta tag as defense in depth for the
      custom scheme. Forge development must not ship that packaged policy in
      the HTML — webpack-dev-server already sets DEVELOPMENT_CONTENT_SECURITY_POLICY.
    -->
    <% if (typeof webpackConfig !== 'undefined' && webpackConfig.mode === 'production') { %>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' clinic-doctor-app:; style-src 'self' clinic-doctor-app: 'unsafe-inline'; img-src 'self' clinic-doctor-app: data:; font-src 'self' clinic-doctor-app: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    />
    <% } %>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
