# Module boundary enforcement (ADR 0001, ADR 0002).
#
# Executable form of docs/architecture/c4-component-module-dependency.md:
# a module may import Platform and the modules listed in its ruleset.
# Platform is the shared kernel and must not import a business module.
# Domain/Application/Infrastructure directories are rejected by architecture tests.

parameters:

  paths:
    - ./Modules

  exclude_files:
    - '#.*test.*#i'
    - '#.*/routes/.*#'
    - '#.*/config/.*#'

  layers:

    - name: Platform
      collectors:
        - type: directory
          value: Modules/Platform/.*

    - name: Audit
      collectors:
        - type: directory
          value: Modules/Audit/.*

    - name: Identity
      collectors:
        - type: directory
          value: Modules/Identity/.*

    - name: Auth
      collectors:
        - type: directory
          value: Modules/Auth/.*

    - name: Access
      collectors:
        - type: directory
          value: Modules/Access/.*

    - name: Patients
      collectors:
        - type: directory
          value: Modules/Patients/.*

    - name: Framework
      collectors:
        - type: classLike
          value: ^Illuminate\\.*
        - type: classLike
          value: ^Laravel\\.*
        - type: classLike
          value: ^Symfony\\Component\\HttpFoundation\\.*
        - type: classLike
          value: ^Symfony\\Component\\HttpKernel\\.*
        - type: classLike
          value: ^Inertia\\.*
        - type: classLike
          value: ^App\\Models\\.*

    - name: Providers
      collectors:
        - type: classLike
          value: ^Psr\\.*
        - type: classLike
          value: ^Sentry\\.*
        - type: classLike
          value: ^Monolog\\.*
        - type: classLike
          value: ^GuzzleHttp\\.*
        - type: classLike
          value: ^Predis\\.*
        - type: classLike
          value: ^Kreait\\.*
        - type: classLike
          value: ^OTPHP\\.*
        - type: classLike
          value: ^React\\.*

    - name: DomainSafeVendor
      collectors:
        - type: classLike
          value: ^Symfony\\Component\\Uid\\.*
        - type: classLike
          value: ^Brick\\Money\\.*

  ruleset:

    Platform:
      - DomainSafeVendor
      - Framework
      - Providers

    Audit:
      - Platform
      - DomainSafeVendor
      - Framework
      - Providers

    Identity:
      - Platform
      - Auth
      - Access
      - Audit
      - DomainSafeVendor
      - Framework
      - Providers

    Auth:
      - Platform
      - Identity
      - Access
      - Audit
      - DomainSafeVendor
      - Framework
      - Providers

    Access:
      - Platform
      - Identity
      - Audit
      - DomainSafeVendor
      - Framework
      - Providers

    Patients:
      - Platform
      - Identity
      - Access
      - Audit
      - DomainSafeVendor
      - Framework
      - Providers
