# Post-merge pipeline (Phase 00 §6).
#
#   1. push signed immutable images to the registry
#   2. verify digest, signature, and provenance of those same artifacts
#   3. deploy to the isolated development/staging environment
#   4. run backward-compatible migrations with timeout and lock monitoring
#   5. execute smoke, contract, authorization-canary, and observability checks
#   6. keep production promotion manual until Phase 23 gates pass
#
# Artifacts are built ONCE here and promoted unchanged. Staging and production
# never rebuild from source (ADR 0008), because a rebuild is a different
# artifact and everything verified about the first one stops applying.
#
# Permission matrix (ISR-015):
#   workflow default     contents: read
#   build                packages/id-token/attestations write (push, sign, attest)
#   verify-artifacts     packages/attestations read (no write, no OIDC mint)
#   promotion-fs-scan    inherit default
#   deploy-staging       inherit default
#   promote-production   inherit default

name: post-merge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  build:
    name: Build and sign images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - unit: core-api
            dockerfile: infra/docker/core-api.Dockerfile
          - unit: ai-service
            dockerfile: infra/docker/ai-service.Dockerfile
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signing. The digest, not the tag, is what gets signed: a tag can
      # be moved, a digest cannot.
      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1

      - name: Sign image
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}@${{ steps.build.outputs.digest }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Persist image identity
        run: |
          mkdir -p "${RUNNER_TEMP}/image-identity"
          printf '%s' '${{ steps.build.outputs.digest }}' > "${RUNNER_TEMP}/image-identity/${{ matrix.unit }}.digest"
          printf '%s' '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}' > "${RUNNER_TEMP}/image-identity/${{ matrix.unit }}.image"
          printf '%s' '${{ github.sha }}' > "${RUNNER_TEMP}/image-identity/${{ matrix.unit }}.commit"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: image-digest-${{ matrix.unit }}
          path: ${{ runner.temp }}/image-identity/
          if-no-files-found: error

      - name: Install Trivy
        run: bash scripts/ci/install-trivy.sh

      - name: Verify core-api OpenVEX applicability
        if: matrix.unit == 'core-api'
        run: python3 scripts/ci/verify_core_api_openvex.py --image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}@${{ steps.build.outputs.digest }}
      - name: Prove core-api OpenVEX is not a blanket suppress
        if: matrix.unit == 'core-api'
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/core-api-trivy-vex-narrow.json"
          trivy image \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --ignore-unfixed=false \
            --vex infra/security/vex/core-api-frankenphp-cve-2026-56854.openvex.json \
            --show-suppressed \
            --format json \
            --output "${REPORT}" \
            --skip-version-check \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}@${{ steps.build.outputs.digest }}
          python3 scripts/ci/verify_core_api_openvex.py --assert-narrow-json "${REPORT}"
      - name: Scan the built core-api image
        if: matrix.unit == 'core-api'
        run: |
          set -euo pipefail
          trivy image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed=false \
            --ignorefile infra/security/trivy-image.ignore \
            --vex infra/security/vex/core-api-frankenphp-cve-2026-56854.openvex.json \
            --show-suppressed \
            --skip-version-check \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}@${{ steps.build.outputs.digest }}
      - name: Scan the built image
        if: matrix.unit != 'core-api'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.unit }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: 'false'
          trivyignores: infra/security/trivy-image.ignore

  verify-artifacts:
    name: Verify signatures and provenance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-identity

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a  # v3.8.1

      - name: Verify image digest, signature, and provenance
        env:
          IMAGE_DIGEST_DIR: ${{ runner.temp }}/image-identity
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: https://github.com/${{ github.repository }}/.github/workflows/post-merge.yaml@refs/heads/main
        run: bash scripts/ci/verify-signed-images.sh

  promotion-fs-scan:
    name: Promotion filesystem scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Trivy
        run: bash scripts/ci/install-trivy.sh
      - name: Filesystem scan without merge exceptions
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build, promotion-fs-scan, verify-artifacts]
    environment:
      name: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # STATUS: no staging environment exists yet (evidence ledger blocker 4).
      # This job is written so the gate is visible rather than absent, and
      # fails loudly rather than reporting a green deploy that never happened.
      - name: Deploy
        run: |
          echo "::error::No staging environment is provisioned yet."
          echo "Phase 00 evidence ledger blocker: staging requires an infrastructure decision."
          echo "This job intentionally fails rather than reporting a successful deploy that did not occur."
          exit 1

      - name: Run migrations with lock monitoring
        if: success()
        run: |
          # Migrations run as clinic_migrator with a statement timeout, and a
          # watcher reports any lock held longer than five seconds so a
          # long-locking migration is caught in staging, not production.
          echo "placeholder: migrate --database=pgsql_migrator --force"

      - name: Smoke, contract, and authorization-canary checks
        if: success()
        run: |
          echo "placeholder - smoke suite against staging"

  promote-production:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Manual approval, and it stays manual until the Phase 23 gates pass.
    environment:
      name: production
    if: false
    steps:
      - name: Blocked until Phase 23
        run: |
          echo "Production promotion is blocked until Phase 23 gates pass:"
          echo "  restore/failover proof, migration rollback rehearsal,"
          echo "  security and privacy sign-off, load evidence."
          exit 1
