# Pull-request pipeline (Phase 00 §6).
#
# Order matters: cheap checks fail fast so a formatting mistake does not wait
# behind a container integration suite.
#
#   1. format and lint each language
#   2. compile/type-check and run architecture rules
#   3. validate OpenAPI and event schemas, regenerate clients
#   4. unit and component suites, then containerized integration suites
#   5. secret scanning, SAST, dependency audit, IaC/container scan, SBOM
#   6. build immutable artifacts once
#
# Path filters keep the runtime honest: only changed units run their full
# suite, while contract validation always runs because a contract change
# affects every consumer.
#
# Evidence binds to the pull-request head commit. github.sha on pull_request
# is GitHub's synthetic merge ref, not the reviewed candidate.

name: pull-request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run for the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  CANDIDATE_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
  TRIVY_VERSION: v0.70.0

jobs:

  # ---------------------------------------------------------------- changes
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      core_api: ${{ steps.filter.outputs.core_api }}
      ai_service: ${{ steps.filter.outputs.ai_service }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
      flutter: ${{ steps.filter.outputs.flutter }}
      desktop: ${{ steps.filter.outputs.desktop }}
      contracts: ${{ steps.filter.outputs.contracts }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        run: bash scripts/ci/assert-candidate-sha.sh
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        id: filter
        with:
          filters: |
            core_api:
              - 'apps/core-api/**'
              - 'packages/contracts/**'
            ai_service:
              - 'apps/ai-service/**'
              - 'packages/contracts/ai_internal/**'
            admin_web:
              - 'apps/admin-web/**'
              - 'packages/typescript/**'
              - 'packages/contracts/openapi/**'
            flutter:
              # Patient mobile only. Doctor and pharmacy moved to Electron
              # (ADR 0010) and are matched by the `desktop` filter below.
              - 'apps/patient-app/**'
              - 'packages/flutter/**'
            desktop:
              - 'apps/doctor-desktop/**'
              - 'apps/pharmacy-desktop/**'
              - 'packages/typescript/**'
              - 'packages/contracts/openapi/**'
              - 'tests/desktop-e2e/**'
              - 'scripts/desktop/**'
            contracts:
              - 'packages/contracts/**'
              - 'scripts/contracts/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  # -------------------------------------------------------------- contracts
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          # The breaking-change detector diffs against main, so it needs history.
          fetch-depth: 0
      - name: Record candidate SHA
        run: bash scripts/ci/assert-candidate-sha.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint OpenAPI
        run: npm run contracts:lint

      - name: Validate event schemas
        run: npm run contracts:events

      - name: Evidence ledger integrity
        # Fails on a duplicate gate id or a summary that disagrees with the
        # table. Keeps the headline totals honest without anyone recounting.
        run: node scripts/evidence/count-gates.mjs --expect PASS=30,PARTIAL=16,BLOCKED=0,OPEN=1

      - name: Generate TypeScript client
        run: npm run contracts:generate:ts

      - name: Generate Dart patient client constants
        run: npm run contracts:generate:dart

      - name: Validate AI internal schemas
        run: npm run contracts:ai-internal

      - name: Fail if generated clients are stale
        run: |
          if ! git diff --quiet -- packages/typescript/api_client/src/generated packages/flutter/api_client/lib/src/generated; then
            echo "::error::A generated client is out of date. Run 'npm run contracts:generate:ts' and 'npm run contracts:generate:dart' and commit."
            git diff -- packages/typescript/api_client/src/generated packages/flutter/api_client/lib/src/generated
            exit 1
          fi

      - name: Detect breaking contract changes
        run: |
          git fetch origin main --depth=1
          npm run contracts:breaking

      # Independent second opinion from the upstream tool. Our own checker is
      # the rule-of-record because it encodes ADR 0003 exactly; oasdiff catches
      # classes we may not have thought of.
      - name: Cross-check with oasdiff
        continue-on-error: true
        run: |
          git show origin/main:packages/contracts/openapi/openapi.yaml > /tmp/base.yaml || exit 0
          docker run --rm -v /tmp:/base -v "$PWD/packages/contracts/openapi":/head \
            tufin/oasdiff breaking /base/base.yaml /head/openapi.yaml --fail-on ERR

  # ---------------------------------------------------------------- core-api
  core-api:
    name: Core API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core_api == 'true'

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: clinic_test
          POSTGRES_USER: clinic_migrator
          POSTGRES_PASSWORD: ci_only_not_a_secret
        options: >-
          --health-cmd "pg_isready -U clinic_migrator"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ['6379:6379']

    defaults:
      run:
        working-directory: apps/core-api

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/assert-candidate-sha.sh

      - uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401  # 2.32.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, intl, bcmath, zip, pcntl, redis
          coverage: none
          tools: composer:v2

      - name: Application environment
        # composer install runs package:discover, which boots Identity. Copy
        # committed non-secret placeholders before Composer scripts run.
        # CI postgres uses a distinct password from local.env; workload roles
        # are created by migrations because clinic_migrator is the image
        # superuser.
        run: cp .env.example .env

      - name: Install dependencies from the committed lock
        # --no-interaction with a lock present is a frozen install: a lockfile
        # that would change fails the build (ADR 0008).
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Fail if the lockfile drifted
        run: git diff --exit-code -- composer.lock

      - name: Format check
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Architecture boundaries
        run: ./vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress --fail-on-uncovered

      - name: Migrate
        env:
          DB_HOST: localhost
          DB_DATABASE: clinic_test
          DB_USERNAME: clinic_migrator
          DB_PASSWORD: ci_only_not_a_secret
          DB_MIGRATION_USERNAME: clinic_migrator
          DB_MIGRATION_PASSWORD: ci_only_not_a_secret
        run: php artisan migrate --database=pgsql_migrator --force

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/core-api/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Inertia assets
        # Persona status pages render through Vite. Pest must see a real
        # production manifest; withoutVite() would skip that contract.
        run: npm run build

      - name: Tests
        env:
          DB_HOST: localhost
          DB_DATABASE: clinic_test
          DB_USERNAME: clinic_migrator
          DB_PASSWORD: ci_only_not_a_secret
          DB_MIGRATION_USERNAME: clinic_migrator
          DB_MIGRATION_PASSWORD: ci_only_not_a_secret
          REDIS_HOST: localhost
        run: ./vendor/bin/pest

      - name: Browser CSRF and session cookies
        working-directory: .
        env:
          DB_HOST: localhost
          DB_DATABASE: clinic_test
          DB_USERNAME: clinic_migrator
          DB_PASSWORD: ci_only_not_a_secret
          DB_MIGRATION_USERNAME: clinic_migrator
          DB_MIGRATION_PASSWORD: ci_only_not_a_secret
          REDIS_HOST: localhost
          CLINIC_WEB_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci --prefix tests/e2e
          npx --prefix tests/e2e playwright install --with-deps chromium
          php apps/core-api/artisan serve --host=127.0.0.1 --port=8080 &
          sleep 3
          npx --prefix tests/e2e playwright test --config tests/e2e/playwright.config.ts


  # -------------------------------------------------------------- ai-service
  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ai_service == 'true'
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/assert-candidate-sha.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from hashed requirements
        # --require-hashes means a substituted artifact fails the build.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install ruff==0.16.4 mypy==2.3.1 pytest==9.1.1 pytest-asyncio==1.4.0 respx==0.23.1 hypothesis==6.165.10

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
        env:
          PYTHONPATH: src

  # --------------------------------------------------------------- admin-web
  admin-web:
    name: Admin web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        run: bash scripts/ci/assert-candidate-sha.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run contracts:generate:ts
      - run: npm run admin:lint
      - run: npm run admin:typecheck
      - run: npm run admin:test
      - run: npm run admin:build

  # ----------------------------------------------------------------- flutter
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.flutter == 'true'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        run: bash scripts/ci/assert-candidate-sha.sh
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff  # v2.18.0
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test

  # ----------------------------------------------------------------- desktop
  desktop:
    name: Electron desktops
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.desktop == 'true'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        run: bash scripts/ci/assert-candidate-sha.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run contracts:generate:ts

      - name: Type-check both desktops
        run: npm run desktop:typecheck

      - name: Trust-boundary and IPC contract tests
        # These assert the renderer cannot reach Node/Electron, that no generic
        # IPC exists, that CSP and fuses hold, and that the two applications do
        # not share a security namespace. They run on every commit; the
        # packaged-window equivalents need a real artifact and are gate G-02-09.
        run: npm run desktop:test

      - name: Shared TypeScript packages
        run: npm run packages:test

      # Unsigned packaged-window evidence is G-02-10 (desktop-packaged-e2e).
      # Signing credentials stay out of pull requests (Phase 23).

  # ------------------------------------------ desktop packaged E2E (G-02-10)
  desktop-packaged-e2e:
    name: Packaged Electron E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        shell: bash
        run: bash scripts/ci/assert-candidate-sha.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = Windows ]; then
            # Root `npm ci` on windows-latest (job 98607821468) failed after a
            # full extract (~99s, 3517 log lines) before packaged E2E ran.
            # The same lockfile `npm ci` succeeded on ubuntu/macOS (~16s).
            # The only required hasInstallScript package is msw 2.15.0, whose
            # postinstall is `node -e "import(...).catch(() => void 0)"` —
            # cmd.exe lifecycle scripts break on `() =>`. Packaged E2E does
            # not need that worker copy; Forge rebuilds natives at package.
            npm ci --ignore-scripts
            node node_modules/electron/install.js
          else
            npm ci
          fi

      - name: Install packaged E2E runner
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = Windows ]; then
            npm ci --ignore-scripts --prefix tests/desktop-e2e
          else
            npm ci --prefix tests/desktop-e2e
          fi

      - run: npm run contracts:generate:ts
        shell: bash

      - name: Linux runtime libraries for packaged Chromium
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-liberation libnss3 libnspr4 \
            libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libgtk-3-0 \
            libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libxfixes3 libxext6 libxi6 libx11-xcb1 libxcb-dri3-0 \
            libxshmfence1 libxss1 libxtst6 libpango-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libcups2 libasound2t64 \
            || sudo apt-get install -y xvfb fonts-liberation libnss3 libnspr4 \
            libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libgtk-3-0 \
            libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libxfixes3 libxext6 libxi6 libx11-xcb1 libxcb-dri3-0 \
            libxshmfence1 libxss1 libxtst6 libpango-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libcups2 libasound2

      - name: Packaged Doctor and Pharmacy WebdriverIO
        shell: bash
        env:
          # Installers/signing stay Phase 23. This job packages and launches the
          # unsigned Forge binaries. Make is best-effort locally, not the gate.
          CLINIC_DESKTOP_SKIP_MAKE: '1'
        run: node scripts/desktop/run-packaged-e2e.mjs

      - name: Upload packaged E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: g-02-10-${{ matrix.os }}
          path: |
            tests/desktop-e2e/logs/
            docs/evidence/phase-00/g-02-10-packaged-electron-e2e.json
            docs/evidence/phase-00/g-02-10-packaged-electron-e2e.md
          if-no-files-found: warn


  # ---------------------------------------------------------------- security
  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Record candidate SHA
        run: bash scripts/ci/assert-candidate-sha.sh

      # Fork/PR jobs must not receive repository secrets or a PAT. The
      # automatically issued workflow token is enough for gitleaks to resolve
      # the pull-request diff.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3  # v2.3.7
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: SAST
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1
        with:
          config: >-
            p/default
            p/security-audit
            p/secrets
            p/owasp-top-ten

      - name: SF-001 merge exception expiry
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          expiry = datetime(2026, 11, 26, tzinfo=timezone.utc)
          if datetime.now(timezone.utc) >= expiry:
              raise SystemExit("SF-001 merge exception expired; extract-zip must be fixed or a new exception recorded")
          print("SF-001 merge exception still in window until 2026-11-26T00:00:00Z")
          PY

      - name: Install Trivy
        # Older trivy-action (v0.29.0) resolved setup-trivy by a withdrawn
        # version tag after the 2026-03-19 Trivy incident. Pin both actions
        # by commit SHA and skip the nested installer.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Filesystem and dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: infra/security/trivy-merge.ignore

      - name: Generate SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75  # v0.17.9
        with:
          format: spdx-json
          artifact-name: clinic-platform.sbom.spdx.json

  # ----------------------------------------------------------- runtime images
  image-scan:
    name: Runtime image scan
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core_api == 'true' || needs.changes.outputs.ai_service == 'true' || needs.changes.outputs.infra == 'true'
    strategy:
      matrix:
        include:
          - unit: core-api
            dockerfile: infra/docker/core-api.Dockerfile
          - unit: ai-service
            dockerfile: infra/docker/ai-service.Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Record candidate SHA
        run: bash scripts/ci/assert-candidate-sha.sh
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0
      - id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: false
          load: true
          tags: clinic-pr/${{ matrix.unit }}:scan
          build-args: |
            APP_VERSION=0.0.0-pr
            BUILD_COMMIT=${{ env.CANDIDATE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: clinic-pr/${{ matrix.unit }}:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: 'false'
          trivyignores: infra/security/trivy-image.ignore
