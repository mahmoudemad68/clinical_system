# Path filters for .github/workflows/pull-request.yaml.
# Root Node workspace files (package.json / package-lock.json; npm workspaces
# live in package.json) must select every client job that installs from the
# root lockfile (ISR-015). Packaged Electron E2E follows the `desktop` flag.
# Do not add root Node files to AI or Core API jobs.

core_api:
  - 'apps/core-api/**'
  - 'packages/contracts/**'
  - 'tests/e2e/**'

ai_service:
  - 'apps/ai-service/**'
  - 'packages/contracts/ai_internal/**'

admin_web:
  - 'apps/admin-web/**'
  - 'packages/typescript/**'
  - 'packages/typescript/tsconfig.base.json'
  - 'packages/contracts/openapi/**'
  - 'package.json'
  - 'package-lock.json'
  - 'tests/e2e/**'

flutter:
  # Patient mobile. Consumes root Node to generate the Dart OpenAPI constants.
  - 'apps/patient-app/**'
  - 'packages/flutter/**'
  - 'package.json'
  - 'package-lock.json'
  - 'scripts/flutter/**'
  - 'apps/core-api/tests/Support/bin/seed-chunk13-patient-flutter.php'

desktop:
  - 'apps/doctor-desktop/**'
  - 'apps/pharmacy-desktop/**'
  - 'packages/typescript/**'
  - 'packages/typescript/tsconfig.base.json'
  - 'packages/contracts/openapi/**'
  - 'tests/desktop-e2e/**'
  - 'scripts/desktop/**'
  - 'apps/core-api/tests/Support/bin/seed-chunk12-doctor-practice.php'
  - 'apps/core-api/tests/Support/bin/accept-chunk12-invitation.php'
  - 'package.json'
  - 'package-lock.json'

contracts:
  - 'packages/contracts/**'
  - 'scripts/contracts/**'

infra:
  - 'infra/**'
  - '.github/workflows/**'
  - 'scripts/ci/**'
