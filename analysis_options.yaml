# Shared analyzer configuration for every Dart package in this repository.
#
# The phase file allows `very_good_analysis` or an ADR-approved profile. This is
# the strict core of that profile written out directly, so the rule set is
# visible and reviewable rather than an opaque version bump.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Clinical software should not ship with unhandled cases. A missing enum
    # branch in a state machine is a silent wrong answer, not a style issue.
    missing_enum_case_clauses: error
    missing_required_param: error
    missing_return: error
    # An unawaited future is a silently swallowed failure.
    unawaited_futures: error
    # Dead null-aware code usually means an assumption is already wrong.
    invalid_null_aware_operator: error
    unnecessary_null_comparison: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "**/build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_print                      # use the logging port, never stdout
    - avoid_relative_lib_imports
    - avoid_returning_null_for_void
    - avoid_slow_async_io
    - avoid_type_to_string
    - await_only_futures
    - cancel_subscriptions             # a leaked stream keeps a screen alive
    - close_sinks
    - comment_references
    - control_flow_in_finally
    - depend_on_referenced_packages
    - directives_ordering
    - empty_catches
    - eol_at_end_of_file
    - exhaustive_cases
    - hash_and_equals
    - implicit_call_tearoffs
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_duplicate_case_values
    - no_logic_in_create_state
    - non_constant_identifier_names
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_typing_uninitialized_variables
    - require_trailing_commas
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unnecessary_await_in_return
    - unnecessary_statements
    - use_build_context_synchronously  # async gap + BuildContext is a real crash
    - use_key_in_widget_constructors
    - use_super_parameters
    - valid_regexps
