<script>
        // Simple auto-advance logic for auth cells
        const inputs = document.querySelectorAll('.auth-cell');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only numbers
                input.value = input.value.replace(/[^0-9]/g, '');
                
                if (input.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = (e.clipboardData || window.clipboardData).getData('text');
                const numericData = pastedData.replace(/[^0-9]/g, '');
                
                if(numericData) {
                    for(let i=0; i<numericData.length && index+i < inputs.length; i++) {
                        inputs[index+i].value = numericData[i];
                    }
                    const nextIndex = Math.min(index + numericData.length, inputs.length - 1);
                    inputs[nextIndex].focus();
                }
            });
        });
    </script>
