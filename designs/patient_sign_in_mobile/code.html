<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Clinic Sign-In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            extend: {

                      "surface-variant": "#e6e0e9",

                      "on-primary-container": "#e0d2ff",
                      "on-surface-variant": "#494551",
                      "outline": "#7a7582",

                      "on-primary-fixed-variant": "#4f378a",
                      "primary-fixed-dim": "#cfbcff",
                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#322f35",
                      "surface-dim": "#ded8e0",
                      "primary": "#4f378a",
                      "tertiary-container": "#c9a74d",
                      "background": "#fdf7ff",
                      "primary-fixed": "#e9ddff",
                      "on-secondary-fixed-variant": "#4b4263",
                      "secondary-fixed-dim": "#cdc0e9",
                      "secondary": "#63597c",
                      "surface-container": "#f2ecf4",
                      "on-tertiary-fixed": "#241a00",
                      "inverse-on-surface": "#f5eff7",
                      "on-secondary-fixed": "#1f1635",
                      "on-secondary-container": "#645a7d",
                      "primary-container": "#6750a4",
                      "on-primary-fixed": "#22005d",
                      "on-secondary": "#ffffff",
                      "surface-bright": "#fdf7ff",
                      "surface-container-low": "#f8f2fa",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#e9ddff",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "gutter-desktop": "24px",
                      "xs": "4px",
                      "sm": "8px",
                      "xl": "32px",
                      "lg": "24px",
                      "2xl": "48px",
                      "md": "16px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "mono-data": [
                              "jetbrainsMono"
                      ]

              "fontSize": {
                      "body-lg": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface flex justify-center items-center min-h-screen">
<!-- Mobile Frame -->
<div class="w-[390px] h-[844px] bg-background relative overflow-hidden flex flex-col shadow-2xl rounded-[40px] border-[8px] border-inverse-surface">
<!-- TopNavBar (Patient) - Suppressed as per rule: Linear/Transactional (Login) -->
<!-- Main Content Area (Scrollable) -->
<main class="flex-1 overflow-y-auto pb-[90px] px-margin-mobile pt-12 flex flex-col justify-center relative z-10">
<div class="absolute top-0 right-0 p-4">
<button class="flex items-center gap-2 text-primary font-body-sm text-body-sm px-3 py-1 rounded-full bg-surface-container-high hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-size: 16px;">language</span>
                    Language
                </button>
</div>
<!-- Login Card (Glassmorphism inspired, soft and empathetic) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[32px] p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative z-20 mt-8">
<div class="text-center mb-8">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-primary text-3xl">favorite</span>
</div>
<h1 class="font-h1-mobile text-h1-mobile font-bold text-on-surface mb-2">My Clinic</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Secure access to your health records.</p>
</div>
<form class="flex flex-col gap-unit">
<!-- Mobile Number Input -->
<div class="flex flex-col gap-1 mb-4">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="mobile">Mobile Number</label>
<div class="flex">
<div class="flex items-center justify-center bg-surface-container-high border border-outline-variant border-r-0 rounded-l-lg px-3 py-3">
<span class="font-body-md text-body-md text-on-surface-variant">+20</span>
</div>
<input class="flex-1 bg-surface-container-lowest border border-outline-variant rounded-r-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="mobile" placeholder="10x xxx xxxx" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1 mb-6">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-1" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow pr-12" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-bold py-3.5 rounded-full hover:bg-primary/90 active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(79,55,138,0.2)]" type="button">
                        Sign In
                    </button>
</form>
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        New patient? <a class="text-primary font-semibold hover:underline" href="#">Create account</a>
</p>
</div>
</div>
<!-- Background Decorative Elements -->
<div class="absolute top-[-100px] left-[-50px] w-64 h-64 bg-secondary-container/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
<div class="absolute top-[200px] right-[-100px] w-72 h-72 bg-primary-container/30 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
</main>
<!-- BottomNavBar - Suppressed as per rule: Linear/Transactional (Login) -->
</div>
</body></html>
