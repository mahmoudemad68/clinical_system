<style>
        body {
            background-color: #f7fafc;
            color: #181c1e;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Utility for 200% text reflow testing */
        @media (min-width: 320px) and (max-width: 480px) {
            html {
                font-size: 100%;
            }
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background min-h-[844px] max-w-[390px] mx-auto relative pb-[90px] pt-[64px] overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-[64px] z-50 bg-surface shadow-sm flex justify-between items-center px-margin-mobile max-w-[390px] mx-auto">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center shrink-0 cursor-pointer active:scale-95 duration-100 ease-in-out">
<img alt="Patient Profile Picture" class="w-full h-full object-cover" data-alt="A professional headshot of a smiling patient in a bright, modern clinic waiting area. High-key lighting, soft white aesthetic, conveying trust and calm in a modern medical context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHaK_5jfqlzTy3gr_p934Zhp8RL23-lP2e6rXEtoD_3M-C34BQdLvhxepKKsZtDi-eGbZ09bPIy0eevxMIPOrDQfXWh2qh3rLyhQgG6Kk-KLe3HnHNS5DdRXRgq7fGDdkQombEc0TIYStbMU7fkDxoFsOmYdbOqlZM81daiSY5hlibd7iI4gxBf0GZR3_0MkQXMsg4XWqBNW8Oad2ESHwgr1fxVrr3aJ6XEdeZ9eVUf3n7nvD6JAJr"/>
</div>
<div class="text-center font-headline-md text-headline-md font-semibold text-primary truncate max-w-[200px]">
            HealthPath
        </div>
<button aria-label="Notifications" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors active:scale-95 duration-100 ease-in-out shrink-0 relative">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
</button>
</header>
<!-- Main Content -->
<main class="px-margin-mobile flex flex-col gap-lg py-md">
<!-- Welcome Banner -->
<section class="flex flex-col gap-xs mt-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Good morning, Alex</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Last updated today at 8:00 AM</p>
</section>
<!-- Today Hero Card -->
<section class="bg-surface-lowest border border-surface-variant rounded-xl shadow-sm p-md flex flex-col gap-md relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="flex justify-between items-start">
<div class="flex gap-sm items-center">
<div class="w-8 h-8 rounded-full bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">calendar_today</span>
</div>
<span class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Today</span>
</div>
<span class="bg-secondary-container/20 text-secondary-container px-2 py-1 rounded font-label-sm text-label-sm border border-secondary-container/30">Confirmed</span>
</div>
<div class="flex flex-col gap-xs">
<h2 class="font-title-lg text-title-lg text-on-background">Dr. Sarah Jenkins</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Cardiology Follow-up</p>
</div>
<div class="flex items-center gap-md bg-surface-container-low p-sm rounded-lg">
<span class="material-symbols-outlined text-on-surface-variant">schedule</span>
<span class="font-label-lg text-label-lg text-on-surface">10:00 AM - 10:45 AM</span>
</div>
<div class="flex gap-sm mt-xs">
<button class="flex-1 bg-primary text-on-primary font-label-lg text-label-lg py-2 rounded-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[18px]">directions</span>
                    Directions
                </button>
<button aria-label="More options" class="w-12 border border-outline-variant text-on-surface-variant rounded-lg flex items-center justify-center hover:bg-surface-variant active:bg-surface-container transition-colors">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</div>
</section>
<!-- Quick Destinations Grid -->
<section class="grid grid-cols-4 gap-sm">
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined">smart_toy</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Medical<br/>AI</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-secondary group-hover:bg-secondary-container/20 transition-colors">
<span class="material-symbols-outlined">medication</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Find<br/>Medicine</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary group-hover:bg-tertiary-container/20 transition-colors">
<span class="material-symbols-outlined">stethoscope</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Find<br/>Doctor</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">event</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Appointments</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">prescriptions</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Prescriptions</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">folder_shared</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Medical<br/>Record</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">science</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Labs &amp;<br/>Reports</span>
</button>
<button class="flex flex-col items-center gap-xs p-sm rounded-xl hover:bg-surface-variant transition-colors active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface group-hover:bg-surface-container-highest transition-colors relative">
<span class="material-symbols-outlined">chat</span>
<span class="absolute top-0 right-0 w-3 h-3 bg-primary rounded-full border-2 border-surface-container-high"></span>
</div>
<span class="font-label-sm text-label-sm text-on-surface text-center break-words leading-tight">Chat</span>
</button>
</section>
<!-- Recent Vitals Micro-Card -->
<section class="bg-surface border border-surface-variant rounded-xl p-md mt-sm flex justify-between items-center shadow-sm">
<div class="flex gap-md items-center">
<div class="w-10 h-10 rounded-full bg-error-container/20 flex items-center justify-center text-error">
<span class="material-symbols-outlined">favorite</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Last BP Reading</span>
<span class="font-body-lg text-body-lg text-on-background">120/80 <span class="text-[14px] text-on-surface-variant">mmHg</span></span>
</div>
</div>
<button aria-label="View all vitals" class="text-primary font-label-lg text-label-lg active:scale-95 transition-transform">
                View All
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 w-full flex justify-around items-center pt-2 pb-safe px-2 bg-surface-container shadow-lg rounded-t-xl z-50 max-w-[390px] mx-auto min-h-[70px]">
<!-- Active: Home -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-1 active:scale-90 duration-200 transition-all" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm font-bold mt-1">Home</span>
</a>
<!-- Inactive: Records -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">description</span>
<span class="font-label-sm text-label-sm mt-1">Records</span>
</a>
<!-- Inactive: Messages -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-200 relative" href="#">
<span class="material-symbols-outlined">chat</span>
<span class="font-label-sm text-label-sm mt-1">Messages</span>
</a>
<!-- Inactive: Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</a>
</nav>
<!-- pb-safe polyfill style for older browsers if needed, though Tailwind manages layout above -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
</body></html>
