<body class="bg-background text-on-background font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<div class="relative min-h-screen flex flex-col pb-40 max-w-2xl mx-auto bg-surface">
<!-- TopAppBar (Transactional Context - No BottomNav) -->
<header class="bg-surface docked full-width top-0 sticky z-50 flex items-center justify-between px-margin-mobile w-full h-16">
<button class="text-primary hover:bg-surface-variant/20 rounded-full p-2 transition-transform active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">MedLink</h1>
<button class="text-primary hover:bg-surface-variant/20 rounded-full p-2 transition-transform active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
</button>
</header>
<div class="h-px w-full bg-primary/5 relative z-50"></div>
<!-- Main Content -->
<main class="flex-1 flex flex-col">
<!-- Progress Indicator -->
<div class="px-margin-mobile py-lg">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Booking Progress</span>
<span class="font-label-sm text-label-sm text-primary font-bold">Step 2 of 3</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3 rounded-full transition-all duration-500 ease-in-out"></div>
</div>
</div>
<!-- Doctor Context Card (Level 1 Elevation) -->
<div class="px-margin-mobile mb-lg">
<div class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant/30 flex items-center gap-md shadow-[0_4px_24px_-8px_rgba(0,0,0,0.05)]">

<div>
<h2 class="font-title-lg text-title-lg text-on-surface leading-tight">Dr. Sarah Jenkins</h2>
<div class="flex items-center gap-xs mt-1">
<div class="bg-secondary-container/50 px-2 py-0.5 rounded-full flex items-center gap-1 border border-secondary-container">
<span class="material-symbols-outlined text-[14px] text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-label-sm text-label-sm text-secondary">Cardiology</span>
</div>
</div>
</div>
</div>
</div>
<!-- Date Picker (Horizontal Strip) -->
<section class="mb-lg pt-4">
<h3 class="font-title-lg text-title-lg text-on-surface mb-md px-margin-mobile">Select Date</h3>
<div class="flex gap-sm overflow-x-auto no-scrollbar pb-2 px-margin-mobile snap-x">
<!-- Inactive Past Date -->
<div class="flex flex-col items-center justify-center min-w-[72px] h-24 rounded-xl bg-surface-container-low text-on-surface-variant/40 flex-shrink-0 snap-start border border-transparent">
<span class="font-label-sm text-label-sm uppercase mb-xs">Sun</span>
<span class="font-headline-md text-headline-md">29</span>
<span class="font-label-sm text-label-sm mt-xs">Oct</span>
</div>
<!-- Active Date -->
<button class="flex flex-col items-center justify-center min-w-[72px] h-24 rounded-xl bg-primary text-on-primary flex-shrink-0 snap-start shadow-md shadow-primary/20 transition-transform active:scale-95 border border-primary">
<span class="font-label-sm text-label-sm opacity-90 uppercase mb-xs">Mon</span>
<span class="font-headline-md text-headline-md">30</span>
<span class="font-label-sm text-label-sm opacity-90 mt-xs">Oct</span>
</button>
<!-- Inactive Available Dates -->
<button class="flex flex-col items-center justify-center min-w-[72px] h-24 rounded-xl bg-surface-container text-on-surface-variant flex-shrink-0 snap-start hover:bg-surface-variant transition-colors border border-transparent">
<span class="font-label-sm text-label-sm opacity-70 uppercase mb-xs">Tue</span>
<span class="font-headline-md text-headline-md">31</span>
<span class="font-label-sm text-label-sm opacity-70 mt-xs">Oct</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[72px] h-24 rounded-xl bg-surface-container text-on-surface-variant flex-shrink-0 snap-start hover:bg-surface-variant transition-colors border border-transparent">
<span class="font-label-sm text-label-sm opacity-70 uppercase mb-xs">Wed</span>
<span class="font-headline-md text-headline-md">01</span>
<span class="font-label-sm text-label-sm opacity-70 mt-xs">Nov</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[72px] h-24 rounded-xl bg-surface-container text-on-surface-variant flex-shrink-0 snap-start hover:bg-surface-variant transition-colors border border-transparent">
<span class="font-label-sm text-label-sm opacity-70 uppercase mb-xs">Thu</span>
<span class="font-headline-md text-headline-md">02</span>
<span class="font-label-sm text-label-sm opacity-70 mt-xs">Nov</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[72px] h-24 rounded-xl bg-surface-container text-on-surface-variant flex-shrink-0 snap-start hover:bg-surface-variant transition-colors border border-transparent">
<span class="font-label-sm text-label-sm opacity-70 uppercase mb-xs">Fri</span>
<span class="font-headline-md text-headline-md">03</span>
<span class="font-label-sm text-label-sm opacity-70 mt-xs">Nov</span>
</button>
</div>
</section>

<h3 class="font-title-lg text-title-lg text-on-surface mb-lg">Available Slots</h3>
<!-- Morning Group -->
<div class="mb-lg">
<h4 class="font-label-lg text-label-lg text-tertiary flex items-center gap-xs mb-md">
<span class="material-symbols-outlined text-[20px]">light_mode</span> Morning
                    </h4>
<div class="grid grid-cols-3 gap-md">
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">09:00 AM</button>
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">09:30 AM</button>
<!-- Selected Slot -->
<button class="bg-primary border border-primary text-on-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center shadow-md shadow-primary/20">10:00 AM</button>
<!-- Disabled Slot -->
<button class="bg-surface-dim border border-transparent text-on-surface-variant/40 font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center line-through cursor-not-allowed">10:30 AM</button>
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">11:00 AM</button>
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">11:30 AM</button>

</div>

<button class="bg-surface-dim border border-transparent text-on-surface-variant/40 font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center line-through cursor-not-allowed">01:30 PM</button>
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">02:00 PM</button>
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">02:30 PM</button>
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">03:00 PM</button>
<button class="bg-surface-container-lowest border border-primary text-primary font-label-lg text-label-lg h-12 rounded-lg flex items-center justify-center hover:bg-primary/5 transition-colors">03:30 PM</button>
</div>
</div>
</section>

<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/95 backdrop-blur-xl pb-8 pt-4 px-margin-mobile [box-shadow:0_-4px_24px_0_rgba(0,0,0,0.06)] z-50 border-t border-outline-variant/20">
<div class="max-w-2xl mx-auto flex flex-col gap-md">
<div class="flex items-center gap-sm px-2">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-[20px]">calendar_month</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-0.5">Selected Appointment</p>
<p class="font-title-lg text-[18px] leading-tight text-on-surface font-semibold">Monday, Oct 30 <span class="text-primary mx-1">•</span> 10:00 AM</p>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg h-14 rounded-full hover:bg-on-primary-fixed-variant transition-colors shadow-md shadow-primary/20 flex items-center justify-center gap-sm active:scale-[0.98]">
                    Continue to Review
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
