<!DOCTYPE html>

<html dir="ltr" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Patient Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#006b5f",
                        "on-primary-fixed": "#001c3a",
                        "on-background": "#181c1e",
                        "primary-fixed": "#d4e3ff",
                        "background": "#f7fafc",
                        "tertiary-fixed-dim": "#afcbd8",
                        "surface-bright": "#f7fafc",
                        "on-tertiary-fixed": "#021f29",
                        "surface-variant": "#e0e3e5",
                        "primary-container": "#1976d2",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-container": "#8df5e4",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#8df5e4",
                        "surface-tint": "#005faf",
                        "outline-variant": "#c1c6d4",
                        "surface-container": "#ebeef0",
                        "secondary-fixed-dim": "#70d8c8",
                        "on-surface": "#181c1e",
                        "surface": "#f7fafc",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#004786",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#cbe7f5",
                        "inverse-surface": "#2d3133",
                        "on-secondary-container": "#007165",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#304a55",
                        "on-tertiary-container": "#fdfdff",
                        "on-secondary-fixed": "#00201c",
                        "surface-container-high": "#e5e9eb",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container-low": "#f1f4f6",
                        "on-surface-variant": "#414752",
                        "on-secondary-fixed-variant": "#005048",
                        "inverse-on-surface": "#eef1f3",
                        "tertiary": "#46606c",
                        "outline": "#717783",
                        "primary-fixed-dim": "#a5c8ff",
                        "primary": "#005dac",
                        "on-primary-container": "#fffdff",
                        "surface-dim": "#d7dadc",
                        "inverse-primary": "#a5c8ff",
                        "tertiary-container": "#5f7985",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "margin-tablet": "32px",
                        "xs": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "sm": "8px",
                        "md": "16px",
                        "xl": "32px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "0px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "0px", "fontWeight": "600" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Mobile simulator container */
        .mobile-viewport {
            width: 390px;
            height: 844px;
            margin: 0 auto;
            border: 1px solid #e0e3e5;
            position: relative;
            overflow: hidden;
            background-color: #f7fafc;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        /* Custom scrollbar for webkit */
        .scrollable-content::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollable-content::-webkit-scrollbar-thumb {
            background-color: #c1c6d4;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-dim flex items-center justify-center min-h-screen p-4">
<!-- Mobile Device Container -->
<div class="mobile-viewport rounded-xl flex flex-col">
<!-- Top App Bar (Transactional/Onboarding variant) -->
<header class="h-16 flex items-center px-margin-mobile bg-surface text-on-surface z-50 shrink-0 border-b border-surface-variant">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center -ml-3 rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg flex-1 text-center pr-9">Profile Setup</h1>
</header>
<!-- Stepper -->
<div class="px-margin-mobile py-sm bg-surface shrink-0">
<div class="flex items-center justify-between relative">
<!-- Line background -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-0.5 bg-surface-variant z-0"></div>
<!-- Line foreground active -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-0.5 bg-primary z-0"></div>
<!-- Step 1 -->
<div class="flex flex-col items-center z-10 gap-1 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-sm text-label-sm">1</div>
<span class="font-label-sm text-label-sm text-primary">Demographics</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center z-10 gap-1 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant border border-outline-variant flex items-center justify-center font-label-sm text-label-sm">2</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Measurements</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center z-10 gap-1 bg-surface px-1">
<div class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant border border-outline-variant flex items-center justify-center font-label-sm text-label-sm">3</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Review</span>
</div>
</div>
</div>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto scrollable-content bg-background px-margin-mobile py-lg pb-32">
<!-- Safety Notice -->
<div class="flex items-start gap-3 p-md bg-tertiary-fixed rounded-lg mb-lg border border-tertiary-fixed-dim">
<span class="material-symbols-outlined text-on-tertiary-fixed mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-tertiary-fixed">
<strong>Self-reported data:</strong> The information below is for personal tracking and tailoring your experience.
                </p>
</div>
<!-- Demographics Section -->
<section class="bg-surface rounded-xl p-md border border-surface-variant shadow-sm mb-lg">
<h2 class="font-title-lg text-title-lg text-on-surface mb-md">Demographics</h2>
<div class="flex flex-col gap-md">
<!-- Full Name -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="w-full h-14 px-md border border-outline rounded-DEFAULT bg-surface text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="fullName" placeholder="e.g. Jane Doe" type="text"/>
</div>
<!-- Date of Birth -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="dob">Date of Birth</label>
<div class="relative">
<input class="w-full h-14 px-md pr-12 border border-outline rounded-DEFAULT bg-surface text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors appearance-none" id="dob" type="date"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_month</span>
</div>
</div>
<!-- Gender (Chips) -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-sm">Gender</label>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-2 rounded-lg border border-outline-variant bg-surface text-on-surface font-label-lg text-label-lg hover:bg-surface-variant transition-colors">Female</button>
<button class="px-md py-2 rounded-lg border border-primary bg-primary-fixed text-on-primary-fixed font-label-lg text-label-lg transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">check</span>
                                Male
                            </button>
<button class="px-md py-2 rounded-lg border border-outline-variant bg-surface text-on-surface font-label-lg text-label-lg hover:bg-surface-variant transition-colors">Non-binary</button>
<button class="px-md py-2 rounded-lg border border-outline-variant bg-surface text-on-surface font-label-lg text-label-lg hover:bg-surface-variant transition-colors">Prefer not to say</button>
</div>
</div>
</div>
</section>
<!-- Measurements Section -->
<section class="bg-surface rounded-xl p-md border border-surface-variant shadow-sm mb-lg">
<h2 class="font-title-lg text-title-lg text-on-surface mb-md">Measurements</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-md">Used for general health calculations like BMI.</p>
<div class="flex gap-md">
<!-- Height -->
<div class="relative flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="height">Height</label>
<div class="relative flex items-center">
<input class="w-full h-14 pl-md pr-12 border border-outline rounded-DEFAULT bg-surface text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="height" placeholder="175" type="number"/>
<span class="absolute right-md font-body-md text-body-md text-on-surface-variant">cm</span>
</div>
</div>
<!-- Weight -->
<div class="relative flex-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs" for="weight">Weight</label>
<div class="relative flex items-center">
<input class="w-full h-14 pl-md pr-12 border border-outline rounded-DEFAULT bg-surface text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="weight" placeholder="70" type="number"/>
<span class="absolute right-md font-body-md text-body-md text-on-surface-variant">kg</span>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="absolute bottom-0 left-0 w-full p-margin-mobile bg-surface border-t border-surface-variant shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50">
<button class="w-full h-12 bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]">
                Continue to Measurements
            </button>
</div>
</div>
</body></html>
