<!-- Script for simple radio button visual fix (css handles most, but ensuring states) -->
<script>
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const name = e.target.name;
                // Find all dots in the same group and hide them
                document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                    const dot = r.parentElement.querySelector('.w-3.h-3');
                    const border = r.parentElement.querySelector('.w-6.h-6');
                    const icon = r.parentElement.querySelector('.shrink-0 .material-symbols-outlined');
                    const iconBg = r.parentElement.querySelector('.shrink-0.bg-primary-fixed, .shrink-0.bg-surface-variant');
                    
                    if (r.checked) {
                        dot.style.opacity = '1';
                        dot.style.transform = 'scale(1)';
                        border.classList.add('border-primary');
                        border.classList.remove('border-outline-variant');
                        if(icon && name === 'location') icon.classList.add('text-primary');
                        if(iconBg && name === 'location') {
                            iconBg.classList.add('bg-primary-fixed');
                            iconBg.classList.remove('bg-surface-variant');
                        }
                    } else {
                        dot.style.opacity = '0';
                        dot.style.transform = 'scale(0)';
                        border.classList.remove('border-primary');
                        border.classList.add('border-outline-variant');
                        if(icon && name === 'location') icon.classList.remove('text-primary');
                        if(iconBg && name === 'location') {
                            iconBg.classList.remove('bg-primary-fixed');
                            iconBg.classList.add('bg-surface-variant');
                        }
                    }
                });
            });
            // trigger initial state
            radio.dispatchEvent(new Event('change'));
        });
    </script>
