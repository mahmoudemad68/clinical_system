<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {

        }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar Component -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 border-b border-split-divider dark:border-outline flat no shadows flex justify-between items-center w-full px-margin h-16 shrink-0 z-50">
<div class="flex items-center gap-6 h-full">
<div class="font-headline-md text-headline-md text-primary dark:text-primary-fixed flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="monitor_heart" data-weight="fill">monitor_heart</span>
                ClinicalWorkspace
            </div>
<nav class="hidden md:flex h-full gap-1 items-center ml-4">
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80 px-4 h-full flex items-center font-body-md text-body-md">
                    Dashboard
                </button>
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80 px-4 h-full flex items-center font-body-md text-body-md">
                    Patient Queue
                </button>
<button class="text-primary dark:text-primary-fixed-dim border-b-2 border-primary font-bold px-4 h-full flex items-center font-body-md text-body-md">
                    Active Consultation
                </button>
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80 px-4 h-full flex items-center font-body-md text-body-md">
                    Inventory
                </button>
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80 px-4 h-full flex items-center font-body-md text-body-md">
                    Reports
                </button>
</nav>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-1 text-on-surface-variant">
<button class="p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
<div class="h-6 w-px bg-outline-variant mx-2"></div>
<button class="text-clinic-teal font-body-md text-body-md hover:bg-surface-container-high px-4 py-2 rounded transition-colors cursor-pointer active:opacity-80">
                Save Draft
            </button>
<button class="bg-primary text-on-primary font-body-md text-body-md px-4 py-2 rounded shadow-sm hover:bg-primary-container transition-colors cursor-pointer active:opacity-80">
                Sign &amp; Close
            </button>
</div>
</header>
<div class="flex flex-1 overflow-hidden">
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto bg-clinical-bg p-margin">
<div class="max-w-5xl mx-auto space-y-6">
<!-- Active Consultation Header / Identity Banner -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden flex flex-col relative">
<!-- Status Strip -->
<div class="h-1 w-full bg-error"></div>
<div class="p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
<!-- Patient Identity -->
<div class="flex items-start gap-4">
<div class="w-16 h-16 rounded-full bg-surface-variant overflow-hidden shrink-0 border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-3xl text-on-surface-variant" data-icon="person">person</span>
</div>
<div class="flex flex-col">
<h1 class="font-headline-lg text-headline-lg text-on-surface flex items-center gap-3">
                                    John Doe
                                    <span class="inline-flex items-center gap-1 bg-error-container text-on-error-container font-label-caps text-label-caps px-2 py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
                                        ACTIVE
                                    </span>
</h1>
<div class="flex items-center gap-3 mt-1 text-on-surface-variant font-data-mono text-data-mono">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="badge">badge</span>
                                        ID: 4492-X
                                    </span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>42Y Male</span>
</div>
</div>
</div>
<!-- Consultation Details Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-x-8 gap-y-4 shrink-0 bg-surface-container-low p-4 rounded-lg border border-outline-variant">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider mb-1">Appointment</span>
<span class="font-body-md text-body-md text-on-surface font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-clinic-teal" data-icon="stethoscope">stethoscope</span>
                                    General Consult
                                </span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider mb-1">Location</span>
<span class="font-body-md text-body-md text-on-surface font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-clinic-teal" data-icon="location_on">location_on</span>
                                    Downtown Main
                                </span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider mb-1">Start Time</span>
<span class="font-data-mono text-data-mono text-on-surface font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-clinic-teal" data-icon="schedule">schedule</span>
                                    10:15 AM
                                </span>
</div>
</div>
</div>
<!-- Action Bar Footer -->
<div class="bg-surface-container px-6 py-3 border-t border-split-divider flex justify-between items-center">
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_back">arrow_back</span>
                                Return to Queue
                            </button>
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md">
<span class="material-symbols-outlined text-[20px]" data-icon="open_in_new">open_in_new</span>
                                Open Record
                            </button>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-1 text-clinic-teal font-label-caps text-label-caps">
<span class="material-symbols-outlined text-[16px]" data-icon="cloud_done">cloud_done</span>
                                SYNCED
                            </div>
<button class="bg-error text-on-error hover:bg-[#93000a] transition-colors px-6 py-2 rounded-lg font-body-md text-body-md font-semibold flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="stop_circle">stop_circle</span>
                                End Consultation
                            </button>
</div>
</div>
</div>
<!-- Requirement / Progress Stepper Mockup -->
<div class="bg-surface-container-lowest rounded-lg border border-requirement-border p-4 shadow-sm flex items-center gap-4">
<div class="w-1 h-full bg-clinic-teal absolute left-0 top-0 rounded-l-lg"></div>
<div class="flex items-center justify-between w-full relative">
<!-- Connecting Line -->
<div class="absolute top-1/2 left-4 right-4 h-px bg-outline-variant -z-10 -translate-y-1/2"></div>
<div class="flex flex-col items-center gap-2 bg-surface-container-lowest px-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-sm" data-icon="check">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface">Vitals</span>
</div>
<div class="flex flex-col items-center gap-2 bg-surface-container-lowest px-2">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center border-2 border-primary">
<span class="font-label-caps text-label-caps">2</span>
</div>
<span class="font-label-caps text-label-caps text-primary font-bold">Notes</span>
</div>
<div class="flex flex-col items-center gap-2 bg-surface-container-lowest px-2">
<div class="w-8 h-8 rounded-full bg-surface-container text-outline flex items-center justify-center border border-outline-variant">
<span class="font-label-caps text-label-caps">3</span>
</div>
<span class="font-label-caps text-label-caps text-outline">Diagnosis</span>
</div>
<div class="flex flex-col items-center gap-2 bg-surface-container-lowest px-2">
<div class="w-8 h-8 rounded-full bg-surface-container text-outline flex items-center justify-center border border-outline-variant">
<span class="font-label-caps text-label-caps">4</span>
</div>
<span class="font-label-caps text-label-caps text-outline">Plan</span>
</div>
</div>
</div>
</div>
</main>
</div>
</body></html>
