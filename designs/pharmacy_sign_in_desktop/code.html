<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pharmacy Workspace Sign-In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                      "surface-variant": "#e6e0e9",
                      "inverse-primary": "#cfbcff",
                      "on-primary-container": "#e0d2ff",
                      "on-surface-variant": "#494551",
                      "outline": "#7a7582",
                      "surface-container-high": "#ece6ee",
                      "on-primary-fixed-variant": "#4f378a",
                      "primary-fixed-dim": "#cfbcff",
                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#322f35",
                      "surface-dim": "#ded8e0",
                      "primary": "#4f378a",
                      "tertiary-container": "#c9a74d",
                      "background": "#fdf7ff",

                      "on-secondary-fixed-variant": "#4b4263",
                      "secondary-fixed-dim": "#cdc0e9",
                      "secondary": "#63597c",
                      "surface-container": "#f2ecf4",
                      "on-tertiary-fixed": "#241a00",
                      "inverse-on-surface": "#f5eff7",
                      "on-secondary-fixed": "#1f1635",
                      "on-secondary-container": "#645a7d",
                      "primary-container": "#6750a4",
                      "on-primary-fixed": "#22005d",
                      "on-secondary": "#ffffff",
                      "surface-bright": "#fdf7ff",
                      "surface-container-low": "#f8f2fa",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#e9ddff",
                      "on-tertiary-container": "#503d00"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "gutter-desktop": "24px",
                      "xs": "4px",
                      "sm": "8px",
                      "xl": "32px",
                      "lg": "24px",
                      "2xl": "48px",
                      "md": "16px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "mono-data": [
                              "jetbrainsMono"
                      ]
              },
              "fontSize": {

                      ],

<body class="bg-background text-on-background h-full flex flex-col font-sans antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar (Pharmacy Portal) -->
<!-- Note: Semantic shell mandate says to suppress navigation for linear/transactional screens like login.
         However, the prompt explicitly asks for "TopNavBar (Pharmacy branding - retail focused)."
         We will include a stripped-down version of the TopNavBar that acts more like a branding header. -->
<header class="bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container flex justify-between items-center w-full px-lg h-16 shadow-sm flex-shrink-0">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-h2-desktop" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_pharmacy</span>
<h1 class="font-h2-desktop text-h2-desktop font-black text-on-primary tracking-tight">Pharmacy Portal</h1>
</div>
<!-- Suppressing nav links and actions for sign-in screen as per UX goal -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md bg-surface-container-lowest relative overflow-hidden">
<!-- Decorative background elements (subtle) -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] bg-primary-fixed rounded-full blur-[120px]"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] bg-secondary-fixed rounded-full blur-[100px]"></div>
</div>
<!-- Sign-In Card -->
<div class="bg-surface w-full max-w-md rounded-xl border border-outline-variant shadow-md relative z-10 p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-xs mb-md">
<div class="mx-auto w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-3xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">prescriptions</span>
</div>
<h2 class="font-h1-desktop text-h1-desktop font-bold text-on-surface">Pharmacy Workspace</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Managing prescriptions with trust.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg w-full">
<div class="flex flex-col gap-unit">
<label class="font-body-sm text-body-sm text-on-surface font-medium pl-xs" for="mobile-number">Mobile number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline">phone_iphone</span>
</span>
<input autocomplete="tel" class="w-full bg-surface-container-lowest border border-outline text-on-surface rounded-lg pl-10 pr-sm py-sm font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="mobile-number" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-end pl-xs pr-xs">
<label class="font-body-sm text-body-sm text-on-surface font-medium" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-container hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-sm" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">lock</span>
</span>
<input autocomplete="current-password" class="w-full bg-surface-container-lowest border border-outline text-on-surface rounded-lg pl-10 pr-10 py-sm font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-sm text-outline hover:text-on-surface-variant transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-body-md font-bold rounded-lg py-sm px-md shadow-sm hover:bg-on-primary-fixed hover:shadow-md active:scale-95 transition-all duration-200 mt-sm flex justify-center items-center gap-xs focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-md text-center border-t border-outline-variant pt-md">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
                     Secure System Access
                 </p>
</div>
</div>
</main>
</body></html>
