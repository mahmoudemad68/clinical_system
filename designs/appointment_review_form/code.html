<!DOCTYPE html>

<html lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-16 bg-surface dark:bg-on-background bg-primary dark:bg-inverse-surface opacity-5 shadow-sm flex items-center justify-between px-md w-full h-16 z-50">
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-title-lg font-title-lg font-bold text-primary dark:text-primary-fixed-dim">Clinical Clarity</h1>
<button class="hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform duration-200 p-2 rounded-full flex items-center justify-center">
<div class="w-8 h-8 rounded-full overflow-hidden">
<img alt="User profile picture" class="w-full h-full object-cover" data-alt="A small, circular avatar portrait of a modern medical professional, brightly lit against a clean white background. The image should convey trust and clinical precision, typical of a modern healthcare app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIKYRTT_fHT7gX91u4jtmBGYH-D9xP7VNa6iv4jNkx2Ya0X8zrMxVwDQubDZ0C_SBX6-mTFQ0YcKNZDYGFekHRyvnxi22G3ht-p6wDus6p2VrDKiGcvsbV56PKkUj8x4rpZfKbu34Rn3UFWOdoTR7MIwrEXUF5_d2AdCBO7OsFlva4j8gnxdUS024tmnwrFAvq0TQ9NBy3cHB78sGxOdOHaf_zech5YOX7CopZz7HEa0oeEdobPtD-"/>
</div>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-mobile md:px-margin-tablet max-w-3xl mx-auto w-full flex flex-col gap-lg">
<!-- Header Section -->
<section class="bg-surface-container-lowest rounded-xl p-md border border-outline-variant shadow-[0_2px_4px_rgba(0,0,0,0.05)]">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Rate your Visit</h2>
<div class="flex items-center gap-sm mt-sm">
<span class="material-symbols-outlined text-tertiary" data-icon="stethoscope">stethoscope</span>
<div>
<p class="font-title-lg text-title-lg text-on-surface">Dr. Sarah Jenkins</p>
<p class="font-body-md text-body-md text-on-surface-variant">Cardiology • October 24, 2023 at 10:00 AM</p>
</div>
</div>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-lg bg-surface-container-lowest rounded-xl p-md border border-outline-variant shadow-[0_2px_4px_rgba(0,0,0,0.05)]">
<!-- Rating Control -->
<fieldset>
<legend class="font-label-lg text-label-lg text-on-surface mb-sm">Overall Experience</legend>
<div class="flex flex-col md:flex-row gap-sm md:gap-md">
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="rating" type="radio" value="1"/>
<div class="p-sm text-center border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-low transition-colors">
<span class="block font-label-sm text-label-sm">Poor</span>
<span class="block font-body-lg text-body-lg mt-xs">1</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="rating" type="radio" value="2"/>
<div class="p-sm text-center border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-low transition-colors">
<span class="block font-label-sm text-label-sm">Fair</span>
<span class="block font-body-lg text-body-lg mt-xs">2</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="rating" type="radio" value="3"/>
<div class="p-sm text-center border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-low transition-colors">
<span class="block font-label-sm text-label-sm">Good</span>
<span class="block font-body-lg text-body-lg mt-xs">3</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="rating" type="radio" value="4"/>
<div class="p-sm text-center border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-low transition-colors">
<span class="block font-label-sm text-label-sm">Very Good</span>
<span class="block font-body-lg text-body-lg mt-xs">4</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="rating" type="radio" value="5"/>
<div class="p-sm text-center border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-low transition-colors">
<span class="block font-label-sm text-label-sm">Excellent</span>
<span class="block font-body-lg text-body-lg mt-xs">5</span>
</div>
</label>
</div>
</fieldset>
<!-- Comment Area -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-sm" for="feedback">Your feedback (optional)</label>
<textarea class="w-full p-sm border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-1 focus:ring-primary focus:border-primary transition-shadow font-body-md text-body-md resize-y" id="feedback" name="feedback" placeholder="Describe your experience during the visit..." rows="4"></textarea>
</div>
<!-- Privacy Guidance -->
<div class="flex items-start gap-sm bg-surface-container-low p-sm rounded-lg">
<span class="material-symbols-outlined text-outline mt-xs" data-icon="info">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    Please do not include personal medical details or National ID in your review. Reviews are moderated before being published anonymously.
                </p>
</div>
<!-- Actions -->
<div class="flex flex-col-reverse md:flex-row justify-end gap-md mt-sm">
<button class="px-lg py-sm font-label-lg text-label-lg text-primary border border-primary rounded-full hover:bg-surface-container-low transition-colors active:scale-95" type="button">Cancel</button>
<button class="px-lg py-sm font-label-lg text-label-lg text-on-primary bg-primary rounded-full hover:bg-on-primary-fixed-variant transition-colors shadow-sm active:scale-95" type="submit">Submit Review</button>
</div>
</form>
</main>
<!-- BottomNavBar (Hidden on md and up as per typical responsive layout, though instructions say Destination Rule applies. Assuming this is a sub-page, we should technically suppress it, but leaving it as a requested component to satisfy JSON requirement if needed, however the prompt says "Generate an Appointment Review form", this implies a task-focused sub-page. I will suppress the bottom nav based on "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Task-Focused: Any sub-page featuring a "Close" or "Back" action that implies a temporary departure from the main navigation flow." The cancel button implies this.) -->
</body></html>
