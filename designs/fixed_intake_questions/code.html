<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>HealthPath - AI Assessment</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f1f4f6",
                    "surface-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#e0e3e5",
                    "inverse-surface": "#2d3133",
                    "on-primary-fixed-variant": "#004786",
                    "surface-tint": "#065fae",
                    "surface-variant": "#e0e3e5",
                    "on-surface-variant": "#414751",
                    "secondary": "#006b5f",
                    "primary-container": "#005dac",
                    "error-red": "#ba1a1a",
                    "background": "#f7fafc",
                    "secondary-container": "#9cefdf",
                    "inverse-on-surface": "#eef1f3",
                    "on-tertiary-fixed-variant": "#304a56",
                    "secondary-fixed": "#9ff2e2",
                    "on-primary": "#ffffff",
                    "tertiary-fixed-dim": "#afcbd9",
                    "error": "#ba1a1a",
                    "surface-bright": "#f7fafc",
                    "surface-dim": "#d7dadc",
                    "on-error": "#ffffff",
                    "success-teal": "#006b5f",
                    "on-primary-fixed": "#001c3a",
                    "on-surface": "#181c1e",
                    "tertiary-fixed": "#cbe7f5",
                    "surface-container": "#ebeef0",
                    "outline-variant": "#c1c6d3",
                    "on-secondary-fixed-variant": "#005047",
                    "tertiary-container": "#46606c",
                    "on-tertiary-container": "#bedae8",
                    "on-tertiary": "#ffffff",
                    "primary-fixed-dim": "#a6c8ff",
                    "error-container": "#ffdad6",
                    "surface": "#f7fafc",
                    "on-secondary-container": "#0b6f63",
                    "on-secondary": "#ffffff",
                    "on-background": "#181c1e",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#004583",
                    "surface-container-high": "#e5e9eb",
                    "secondary-fixed-dim": "#83d5c6",
                    "primary-fixed": "#d4e3ff",
                    "on-primary-container": "#bfd7ff",
                    "on-secondary-fixed": "#00201c",
                    "tertiary": "#2e4854",
                    "inverse-primary": "#a6c8ff",
                    "outline": "#727783",
                    "on-tertiary-fixed": "#011f29"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "lg": "24px",
                    "xs": "4px",
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "margin-tablet": "32px",
                    "sm": "8px",
                    "md": "16px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "label-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        /* Custom Input Styles to match Material 3 */
        input[type="radio"]:checked + div {
            border-color: theme('colors.primary');
            background-color: theme('colors.primary-fixed');
        }
        
        input[type="radio"]:checked + div .radio-icon {
            color: theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col m-0 p-0 overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container antialiased w-full max-w-[390px] mx-auto md:max-w-none md:w-auto relative shadow-2xl md:shadow-none">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-background border-b border-surface-variant dark:border-outline-variant shadow-sm max-w-[390px] md:max-w-none mx-auto left-0 right-0">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant active:scale-95 transition-transform text-on-surface-variant dark:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed truncate px-4 flex-1 text-center">AI Assessment</h1>
<button aria-label="More options" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-variant active:scale-95 transition-transform text-on-surface-variant dark:text-on-surface-variant focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</button>
</div>
<!-- Progress Bar -->
<div aria-valuemax="100" aria-valuemin="0" aria-valuenow="20" class="w-full h-1 bg-surface-container-high" role="progressbar">
<div class="h-full bg-primary transition-all duration-500 ease-in-out" style="width: 20%;"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[68px] mb-[90px] px-margin-mobile py-lg overflow-y-auto">
<!-- Step Indicator -->
<div class="mb-sm">
<span class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Step 1 of 5</span>
</div>
<!-- Question Title -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">
            Who are you starting this assessment for?
        </h2>
<!-- Help Text -->
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">
            This helps us tailor the follow-up questions.
        </p>
<!-- Radio Cards Area -->
<form class="space-y-md" id="assessment-form">
<!-- Option 1: Myself -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="assessment_target" onchange="handleSelection()" required="" type="radio" value="myself"/>
<div class="w-full bg-surface-lowest border border-surface-variant rounded-xl p-md flex items-center gap-md transition-all duration-200 hover:bg-surface-container-lowest group-active:scale-[0.98] shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 text-on-surface-variant radio-icon transition-colors">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div class="flex-1">
<span class="font-title-lg text-title-lg text-on-surface block">Myself</span>
</div>
<!-- Selected State Indicator (invisible unless checked via CSS trick or JS, here we use generic radio look but customized) -->
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
<!-- Option 2: My child -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="assessment_target" onchange="handleSelection()" type="radio" value="child"/>
<div class="w-full bg-surface-lowest border border-surface-variant rounded-xl p-md flex items-center gap-md transition-all duration-200 hover:bg-surface-container-lowest group-active:scale-[0.98] shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 text-on-surface-variant radio-icon transition-colors">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">child_care</span>
</div>
<div class="flex-1">
<span class="font-title-lg text-title-lg text-on-surface block">My child</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
<!-- Option 3: Another adult -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="assessment_target" onchange="handleSelection()" type="radio" value="adult"/>
<div class="w-full bg-surface-lowest border border-surface-variant rounded-xl p-md flex items-center gap-md transition-all duration-200 hover:bg-surface-container-lowest group-active:scale-[0.98] shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 text-on-surface-variant radio-icon transition-colors">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">elderly</span>
</div>
<div class="flex-1">
<span class="font-title-lg text-title-lg text-on-surface block">Another adult</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
</label>
</form>
</main>
<!-- Bottom Sticky Actions -->
<div class="fixed bottom-0 left-0 right-0 w-full max-w-[390px] mx-auto md:max-w-none bg-surface border-t border-surface-variant p-margin-mobile shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 pb-safe pb-8">
<div class="flex flex-col gap-md">
<button class="w-full bg-surface-variant text-on-surface-variant opacity-50 cursor-not-allowed font-label-lg text-label-lg py-3 px-6 rounded-full transition-all duration-300 flex items-center justify-center gap-2" disabled="" id="continue-btn">
                Continue
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full bg-transparent text-error font-label-lg text-label-lg py-3 px-6 rounded-full hover:bg-error-container/20 active:scale-95 transition-all flex items-center justify-center">
                Stop &amp; Clear
            </button>
</div>
</div>
<!-- Interactive Script -->
<script>
        function handleSelection() {
            const form = document.getElementById('assessment-form');
            const btn = document.getElementById('continue-btn');
            
            // Check if any radio is selected
            const isSelected = form.querySelector('input[name="assessment_target"]:checked') !== null;
            
            if (isSelected) {
                // Enable button
                btn.disabled = false;
                btn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                btn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary-container', 'hover:text-on-primary-container', 'active:scale-95', 'shadow-sm');
            }
        }
    </script>
</body></html>
