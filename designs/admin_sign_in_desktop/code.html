<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                      "on-surface-variant": "#494551",
                      "outline": "#7a7582",

                      "on-primary-fixed-variant": "#4f378a",
                      "primary-fixed-dim": "#cfbcff",
                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#322f35",
                      "surface-dim": "#ded8e0",
                      "primary": "#4f378a",
                      "tertiary-container": "#c9a74d",
                      "background": "#fdf7ff",
                      "primary-fixed": "#e9ddff",
                      "on-secondary-fixed-variant": "#4b4263",
                      "secondary-fixed-dim": "#cdc0e9",
                      "secondary": "#63597c",
                      "surface-container": "#f2ecf4",
                      "on-tertiary-fixed": "#241a00",
                      "inverse-on-surface": "#f5eff7",
                      "on-secondary-fixed": "#1f1635",
                      "on-secondary-container": "#645a7d",
                      "primary-container": "#6750a4",
                      "on-primary-fixed": "#22005d",
                      "on-secondary": "#ffffff",
                      "surface-bright": "#fdf7ff",
                      "surface-container-low": "#f8f2fa",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#e9ddff",
                      "on-tertiary-container": "#503d00"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "gutter-desktop": "24px",
                      "xs": "4px",
                      "sm": "8px",
                      "xl": "32px",
                      "lg": "24px",
                      "2xl": "48px",
                      "md": "16px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "mono-data": [
                              "jetbrainsMono"

              "fontSize": {

<body class="bg-background min-h-screen font-body-md text-on-background flex">
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-gutter-desktop h-screen relative overflow-hidden">
<!-- Background decorative element -->
<div class="absolute inset-0 opacity-30 pointer-events-none flex justify-center items-center">
<div class="w-[800px] h-[800px] rounded-full bg-gradient-to-tr from-primary-container/20 to-secondary-container/20 blur-[100px]"></div>
</div>
<!-- Sign-In Card -->
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_12px_32px_rgba(0,0,0,0.12)] p-xl relative z-10">
<!-- Header -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-sm">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<h1 class="font-h2-desktop text-h2-desktop text-on-surface">Clinic Admin</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">System-wide governance and oversight.</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Mobile Number Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="mobile_number">Mobile number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-outline">
<span class="material-symbols-outlined">phone_iphone</span>
</span>
<input class="block w-full pl-[40px] pr-sm py-sm font-body-md text-body-md bg-surface-container-lowest border border-outline rounded-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="mobile_number" name="mobile_number" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-outline">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="block w-full pl-[40px] pr-[40px] py-sm font-body-md text-body-md bg-surface-container-lowest border border-outline rounded-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-sm text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full flex items-center justify-center py-sm px-md bg-primary text-on-primary font-label-caps text-label-caps rounded-full hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]" type="submit">
                        Sign in
                    </button>
</div>
</form>
<!-- Footer / System Status (Utilitarian touch) -->
<div class="mt-xl pt-md border-t border-outline-variant flex items-center justify-center gap-sm">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-mono-data text-mono-data text-on-surface-variant">System Status: Optimal</span>
</div>
</div>
</main>
<script>
        // Simple password toggle interaction
        const toggleButton = document.querySelector('button[aria-label="Toggle password visibility"]');
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('toggle-password-icon');

        if(toggleButton && passwordInput && icon) {
            toggleButton.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
    </script>
</body></html>
