<html lang="en"><head>

<style>
        body {
            background-color: #fdf7ff;
            color: #1d1b20;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle glass effect for the login card */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        /* Ambient background shapes */
        .ambient-shape-1 {
            position: absolute;
            top: -10%;
            right: -5%;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(103, 80, 164, 0.08) 0%, rgba(253, 247, 255, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }
        
        .ambient-shape-2 {
            position: absolute;
            bottom: -20%;
            left: 20%;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(207, 188, 255, 0.15) 0%, rgba(253, 247, 255, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background w-full h-full antialiased relative">
<!-- SUPPRESSED NAVIGATION SHELL: The prompt specifies a "Sign-In" screen, which is a linear/transactional flow. 
         Following the "Semantic Shell Mandate", navigation shells (SideNavBar/TopNavBar) MUST be excluded 
         to prioritize the focused journey. -->
<!-- Ambient Background Elements -->
<div class="ambient-shape-1"></div>
<div class="ambient-shape-2"></div>
<!-- Main Content Canvas -->
<main class="w-full h-full flex items-center justify-center relative z-10 px-md">
<!-- Login Card -->
<div class="glass-card w-full max-w-md rounded-xl p-2xl flex flex-col gap-lg bg-surface">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-unit mb-sm">
<!-- Icon/Logo Placeholder -->
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-[32px]" data-icon="local_hospital">local_hospital</span>
</div>
<h1 class="font-h1-desktop text-h1-desktop text-on-surface">Doctor Workspace</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Clinical precision, secure access.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-md">
<!-- Mobile Number Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface" for="mobile-number">Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT py-sm pl-xl pr-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="mobile-number" name="mobile-number" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT py-sm pl-xl pr-xl font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm text-on-surface-variant hover:text-primary transition-colors focus:outline-none flex items-center justify-center w-8 h-8 rounded-full hover:bg-surface-container-low" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-sm">
<button class="w-full bg-primary text-on-primary font-label-caps text-label-caps py-md rounded-full hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-sm" type="submit">Sign in</button>
<div class="text-center mt-xs">
<a class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant underline-offset-2 hover:underline transition-colors" href="#">Forgot password?</a>
</div>
</div>
</form>
<!-- Security Footer Note -->
<div class="mt-md border-t border-outline-variant pt-md flex items-start gap-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] mt-[2px]" data-icon="shield">shield</span>
<p class="font-body-sm text-body-sm text-xs">Access to this system is restricted to authorized clinical personnel. All activity is logged and monitored for compliance.</p>
</div>
</div>
</main>
</body></html>
