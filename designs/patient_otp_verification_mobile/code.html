<body class="bg-background text-on-background flex justify-center items-center min-h-screen p-4">
<!-- Mobile Frame Container (390x844 approx) -->
<main class="w-full max-w-[390px] h-[844px] bg-surface relative overflow-hidden rounded-[40px] shadow-2xl flex flex-col border-8 border-surface-container-high ring-1 ring-outline-variant">
<!-- Header area, linear transactional flow so no complex nav shell -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-surface shrink-0 z-10 relative">
<button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-h1-mobile text-h1-mobile font-bold text-primary truncate">HealthConnect</div>
<!-- Empty div for flex spacing balance -->
<div class="w-10"></div>
</header>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col justify-start px-margin-mobile py-lg overflow-y-auto">
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-[32px]" style="font-variation-settings: 'FILL' 1;">phonelink_lock</span>
</div>
<h1 class="font-h1-mobile text-h1-mobile font-bold text-on-surface mb-xs">Verify your phone</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We've sent a 6-digit code to <br/><span class="font-bold text-on-surface">+20 *** *** 1234</span></p>
</div>
<!-- OTP Input Section -->
<div class="w-full mb-lg relative">
<!-- Accessible backing input (visually hidden but focusable) -->
<input aria-label="Enter 6-digit verification code" autocomplete="one-time-code" class="absolute inset-0 w-full h-full opacity-0 cursor-text z-20" id="otp-input" inputmode="numeric" maxlength="6" pattern="[0-9]*" type="text"/>
<!-- Visual Code Input Cells -->
<div aria-hidden="true" class="flex justify-between items-center gap-2 pointer-events-none w-full" id="otp-display">
<!-- Cell 1 -->
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant rounded-lg flex items-center justify-center font-h2-desktop text-h2-desktop text-on-surface shadow-sm transition-all focus-ring-indicator active-cell">
</div>
<!-- Cell 2 -->
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant rounded-lg flex items-center justify-center font-h2-desktop text-h2-desktop text-on-surface shadow-sm transition-all">
</div>
<!-- Cell 3 -->
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant rounded-lg flex items-center justify-center font-h2-desktop text-h2-desktop text-on-surface shadow-sm transition-all">
</div>
<!-- Cell 4 -->
<div class="w-12 h-14 bg-surface-container-lowest border border-outline-variant rounded-lg flex items-center justify-center font-h2-desktop text-h2-desktop text-on-surface shadow-sm transition-all">

<!-- Cell 5 -->

</div>
</div>
</div>
<!-- Timer and Resend -->

<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">timer</span>
                    Code expires in <span class="font-mono-data text-mono-data text-primary font-bold">01:59</span>
</p>

                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>

<script>
        // Minimal interaction logic for OTP input visualization
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('otp-input');
            const displayCells = document.getElementById('otp-display').children;

            if (input && displayCells) {
                // Focus styling
                input.addEventListener('focus', () => {
                    updateCellsFocus(input.value.length);
                });
                
                input.addEventListener('blur', () => {
                    for(let i=0; i<displayCells.length; i++){
                        displayCells[i].classList.remove('border-primary', 'border-2', 'bg-surface-container-low');
                        displayCells[i].classList.add('border-outline-variant', 'border');
                    }
                });

                // Input handling
                input.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
                    e.target.value = val; // Force numeric

                    for (let i = 0; i < displayCells.length; i++) {
                        displayCells[i].textContent = val[i] || '';
                    }
                    updateCellsFocus(val.length);
                });
                
                function updateCellsFocus(length) {
                    let activeIndex = Math.min(length, 5); // Target current empty cell or last cell
                    
                    for(let i=0; i<displayCells.length; i++){
                        if(i === activeIndex && document.activeElement === input) {
                            displayCells[i].classList.add('border-primary', 'border-2', 'bg-surface-container-low');
                            displayCells[i].classList.remove('border-outline-variant', 'border', 'bg-surface-container-lowest');
                        } else {
                            displayCells[i].classList.remove('border-primary', 'border-2', 'bg-surface-container-low');
                            displayCells[i].classList.add('border-outline-variant', 'border');
                            // Add filled state if there's a value
                            if(displayCells[i].textContent) {
                                displayCells[i].classList.add('bg-surface-container-lowest');
                            }
                        }
                    }
                }
                
                // Init focus state on load if autofocus was used
                if(document.activeElement === input) {
                     updateCellsFocus(input.value.length);
                }
            }
        });
    </script>
