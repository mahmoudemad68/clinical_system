<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Safe Area Padding for Mobile */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        /* Pulse Animation for Alert Icon */
        @keyframes pulse-alert {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(186, 26, 26, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(186, 26, 26, 0);
            }
        }
        
        .alert-pulse {
            animation: pulse-alert 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface h-screen w-full flex flex-col font-body-md overflow-hidden" style="max-width: 390px; margin: 0 auto; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1);">
<!-- Top App Bar (Modified for lock flow - no back button) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-background border-b border-surface-variant shadow-sm flex items-center justify-center px-margin-mobile h-16" style="max-width: 390px;">
<span class="font-title-lg text-title-lg text-primary dark:text-primary-fixed">AI Assessment</span>
<!-- Trailing icon removed for safety lock flow -->
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-[88px] pb-[120px] flex flex-col items-center justify-center text-center">
<!-- Alert Icon -->
<div class="mb-lg w-32 h-32 rounded-full bg-error-container flex items-center justify-center alert-pulse shadow-sm border border-error/20">
<span class="material-symbols-outlined filled text-error text-[64px]" data-icon="e911_emergency">
                e911_emergency
            </span>
</div>
<!-- Title -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">
            Seek Urgent Care Immediately
        </h1>
<!-- Copy -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl px-sm">
            Based on your answers, you may need immediate medical attention. Please stop this assessment and contact emergency services or visit the nearest hospital.
        </p>
<!-- Spacer to push buttons to bottom if needed, though flex-center handles it nicely here -->
<div class="flex-1"></div>
<!-- Action Area -->
<div class="w-full flex flex-col gap-sm mt-xl pb-safe">
<!-- Primary Action - Call Emergency -->
<button aria-label="Call Emergency 123" class="w-full bg-error text-on-error font-label-lg text-label-lg h-[56px] rounded-full flex items-center justify-center gap-xs shadow-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined filled text-[20px]" data-icon="call">
                    call
                </span>
                Call Emergency (123)
            </button>
<!-- Secondary Action - Find ER -->
<button aria-label="Find Nearest ER" class="w-full bg-surface-lowest text-on-surface font-label-lg text-label-lg h-[56px] rounded-full flex items-center justify-center gap-xs border border-outline-variant shadow-sm active:scale-95 transition-transform hover:bg-surface-container-lowest">
<span class="material-symbols-outlined text-[20px]" data-icon="local_hospital">
                    local_hospital
                </span>
                Find Nearest ER
            </button>
<!-- Tertiary Action - Exit -->
<button aria-label="Exit Assessment" class="w-full text-primary font-label-lg text-label-lg h-[48px] rounded-full flex items-center justify-center active:scale-95 transition-transform mt-sm hover:bg-surface-container-low">
                Exit Assessment
            </button>
</div>
</main>
<!-- Navigation Shell Suppressed as per instructions for linear/transactional/dead-end screens -->
</body></html>
