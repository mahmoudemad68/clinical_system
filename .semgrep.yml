# Project-specific Semgrep rules.
#
# These encode clinic invariants that no generic ruleset knows about. The
# community rulesets (p/security-audit, p/owasp-top-ten) run alongside them in
# CI and cover the generic classes.

rules:

  - id: clinic-no-raw-uuid-v4
    languages: [php]
    severity: ERROR
    message: >-
      Use the IdentityGenerator port (UUIDv7), not Str::uuid() or
      Uuid::v4(). Random keys fragment the index on the highest-volume
      tables (ADR 0005).
    pattern-either:
      - pattern: Str::uuid()
      - pattern: Uuid::v4()
      - pattern: Illuminate\Support\Str::uuid()

  - id: clinic-no-facades-in-module-support
    languages: [php]
    severity: ERROR
    paths:
      include: ['apps/core-api/Modules/*/app/Support/**', 'apps/core-api/Modules/*/app/Enums/**']
    message: >-
      Support types and enums must not use a framework facade. Persistence
      and HTTP belong in services and controllers. deptrac enforces module
      isolation; this rule catches facade use at review time.
    pattern-either:
      - pattern: DB::$METHOD(...)
      - pattern: Cache::$METHOD(...)
      - pattern: Log::$METHOD(...)
      - pattern: Http::$METHOD(...)
      - pattern: Queue::$METHOD(...)

  - id: clinic-no-float-money
    languages: [php]
    severity: ERROR
    message: >-
      Money and quantities use integer minor units with an explicit currency
      or unit (invariant 16). A float here silently loses precision on an
      invoice or a stock ledger.
    pattern-either:
      - pattern: (float) $AMOUNT
      - pattern: floatval($AMOUNT)
    paths:
      include:
        - 'apps/core-api/Modules/*/app/Support/**'
        - 'apps/core-api/Modules/*/app/Enums/**'
        - 'apps/core-api/Modules/POS/**'
        - 'apps/core-api/Modules/Inventory/**'

  - id: clinic-no-sensitive-in-log
    languages: [php]
    severity: WARNING
    message: >-
      Do not pass a raw request or an unfiltered array to a logger. Route it
      through the Redactor port; invariant 18 forbids clinical content,
      credentials, and national IDs in logs and traces.
    pattern-either:
      - pattern: Log::$LEVEL($MSG, $REQUEST->all())
      - pattern: Log::$LEVEL($MSG, request()->all())
      - pattern: logger($MSG, $REQUEST->all())

  - id: clinic-no-wildcard-cors
    languages: [php]
    severity: ERROR
    message: >-
      Wildcard CORS origins are forbidden (mandatory Phase 00 control).
      Enumerate the allowed origins explicitly.
    pattern-either:
      - pattern: "'allowed_origins' => ['*']"
      - pattern: "'allowed_origins' => ['*'], ..."

  - id: clinic-no-unbounded-work-in-request
    languages: [php]
    severity: WARNING
    paths:
      include: ['apps/core-api/Modules/*/app/Http/**']
    message: >-
      No HTTP request may wait for PDF extraction, OCR, embeddings, push
      delivery, analytics, or an external API call (plan.md section 174).
      Dispatch it through the outbox after commit.
    pattern-either:
      - pattern: Http::post(...)
      - pattern: Http::get(...)
      - pattern: file_get_contents($URL)
      - pattern: curl_exec(...)

  - id: clinic-python-no-core-db-access
    languages: [python]
    severity: ERROR
    paths:
      include: ['apps/ai-service/**']
    message: >-
      The AI service must not connect to core storage. It holds no core
      database credential and cannot write core tables (ADR 0001).
    pattern-either:
      - pattern: psycopg2.connect(...)
      - pattern: psycopg.connect(...)
      - pattern: sqlalchemy.create_engine(...)
      - pattern: asyncpg.connect(...)

  # ------------------------------------------------------------------ Electron
  # ADR 0010. These encode the renderer/main privilege boundary. Each one
  # corresponds to a documented Electron escape route.

  - id: clinic-electron-no-node-in-renderer
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include: ['apps/*-desktop/src/renderer/**']
      exclude: ['apps/*-desktop/src/renderer/*.d.ts']
    message: >-
      Renderer code must not import Electron or Node. It is an unprivileged
      presentation process; everything else goes through a typed contextBridge
      capability (ADR 0010).
    pattern-either:
      - pattern: import 'electron'
      - pattern: import $X from 'electron'
      - pattern: import { ... } from 'electron'
      - pattern: require('electron')
      - pattern: import $X from 'node:$MOD'
      - pattern: import { ... } from 'node:$MOD'
      - pattern: require('fs')
      - pattern: require('path')
      - pattern: require('child_process')

  - id: clinic-electron-no-generic-ipc
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include: ['apps/*-desktop/src/preload/**']
    message: >-
      Never expose ipcRenderer or a generic invoke(channel, payload) through
      contextBridge. That hands a compromised renderer the entire main-process
      surface and is the most common Electron vulnerability.
    pattern-either:
      - pattern: contextBridge.exposeInMainWorld($NAME, ipcRenderer)
      - pattern: |
          contextBridge.exposeInMainWorld($NAME, { ..., ipcRenderer, ... })
      - pattern: |
          contextBridge.exposeInMainWorld($NAME, { ..., invoke: (channel, ...) => ..., ... })
      - pattern: |
          contextBridge.exposeInMainWorld($NAME, { ..., send: (channel, ...) => ..., ... })

  - id: clinic-electron-no-unsafe-webpreferences
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include: ['apps/*-desktop/**']
    message: >-
      nodeIntegration must stay false, contextIsolation true, sandbox true, and
      webSecurity true. Relaxing any of them removes the renderer/main privilege
      boundary entirely.
    pattern-either:
      - pattern: "nodeIntegration: true"
      - pattern: "contextIsolation: false"
      - pattern: "sandbox: false"
      - pattern: "webSecurity: false"
      - pattern: "allowRunningInsecureContent: true"
      - pattern: "webviewTag: true"
      - pattern: "nodeIntegrationInSubFrames: true"

  - id: clinic-electron-no-remote-content
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include: ['apps/*-desktop/src/main/**']
    message: >-
      The desktop applications load packaged local content only. Loading a
      remote URL into a privileged renderer gives remote code that renderer's
      origin and capabilities.
    pattern-either:
      - pattern: $WIN.loadURL("http://...")
      - pattern: $WIN.loadURL("https://...")

  - id: clinic-electron-no-unrestricted-shell
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include: ['apps/*-desktop/**']
    message: >-
      shell.openExternal and shell.openPath with a non-literal argument let a
      renderer-supplied string reach an OS handler. Parse, allowlist, and
      require explicit user intent first.
    pattern-either:
      - pattern: shell.openExternal($URL)
      - pattern: shell.openPath($PATH)

  - id: clinic-electron-no-secrets-in-renderer-storage
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include: ['apps/*-desktop/src/renderer/**']
    message: >-
      Tokens, database keys, PHI, drafts, and signed URLs must never reach
      renderer web storage. Credentials live in the main process behind
      safeStorage (ADR 0010).
    pattern-either:
      - pattern: localStorage.setItem(...)
      - pattern: sessionStorage.setItem(...)
      - pattern: indexedDB.open(...)
