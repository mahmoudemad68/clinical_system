name: clinic_networking
description: HTTP transport for the clinic clients. Owns correlation IDs, idempotency keys, and error normalization.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  clinic_error_handling:
    path: ../error_handling
  dio: ^5.9.0
  meta: ^1.16.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.0

# Part of the root pub workspace; shares the root lockfile.
resolution: workspace
