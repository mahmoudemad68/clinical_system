name: clinic_api_client
description: Typed API surface for the clinic platform. Generated DTOs stay at this edge and map into client models.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  clinic_common_models:
    path: ../common_models
  clinic_error_handling:
    path: ../error_handling
  clinic_networking:
    path: ../networking
  dio: ^5.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.0

# Part of the root pub workspace; shares the root lockfile.
resolution: workspace
