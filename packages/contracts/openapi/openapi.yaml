          type: string
          minLength: 1
          maxLength: 200
        specialty_id:
          $ref: '#/components/schemas/Uuid'
        syndicate_number:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: |
            Optional write-only professional identifier. Stored with Identity
