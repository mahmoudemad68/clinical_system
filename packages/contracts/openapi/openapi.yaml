openapi: 3.1.0

info:
  title: Clinic Platform API
  version: 0.1.0
  summary: Phase 00 foundation slice — health, readiness, version, and a gated diagnostics path.
  description: |
    This document is the source of truth for the HTTP contract (ADR 0003).
    Server and client code both conform to it; neither generates it.

    Phase 01 adds authentication, identity projection, and deny-by-default
    capabilities.     Phase 02 chunk 01 adds the Patients demographic profile
    vertical slice. Phase 02 chunk 02 adds the Doctors profile foundation
    (`POST /api/v1/doctors/onboarding`, `GET /api/v1/doctors/me/profile`).
    Phase 02 chunk 03 adds doctor verification case submit/status
    (`POST /api/v1/doctors/me/verification-submissions`,
    `GET /api/v1/doctors/me/verification-status`). Phase 02 chunk 04 adds the
    doctor verification secure-upload pipeline
    (`POST /api/v1/verification-uploads`,
    `POST /api/v1/verification-uploads/{upload_id}/complete`,
    `GET /api/v1/verification-uploads/{upload_id}`). Admin UI, pharmacy, clinic,
    and AI capabilities remain absent.

    Compatibility rules (ADR 0003):
      * Additive optional fields are compatible within a version.
      * A removal, a type change, a narrowed enum, or a new required field is
        breaking and requires a new version plus a dual-read migration.
      * Removals require deprecation telemetry proving no live consumer.
  contact:
    name: Platform architecture
    url: https://example.invalid/clinic/platform
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8080
    description: Local Docker Compose
  - url: https://staging.clinic.invalid
    description: Staging (synthetic data only)

tags:
  - name: operational
    description: |
      Unversioned operational probes consumed by the orchestrator and the load
      balancer. These are NOT part of the public client contract, are not
      enveloped, and must never be exposed through the public gateway route.
  - name: meta
    description: Build and version metadata for client display.
  - name: health
    description: Coarse platform health for client display.
  - name: diagnostics
    description: |
      Phase 00 foundation slice. Gated by the server-owned feature flag
      `platform.diagnostics_slice`, which fails closed and is disabled outside
      local and development environments.
  - name: auth
    description: |
      Phase 01 authentication. Device clients use bearer tokens issued once to
      the trusted process. Admin browsers use HttpOnly cookies plus CSRF.
      Endpoints do not silently accept the wrong scheme for a given session kind.
  - name: identity
    description: |
      Phase 01 identity projection. `/me` returns handles and status only.
  - name: patients
    description: |
      Phase 02 patient demographic profiles. Own-profile only. National ID
      is write-only input and never returned. No public National ID lookup.
  - name: doctors
    description: |
      Phase 02 doctor profile foundation plus Verification case submit/status
      and doctor-only secure verification-document upload. Own-profile and
      own-case only. Creating a draft doctor profile does not approve, list, or
      grant clinical capability. National ID and syndicate number are write-only
      and never returned. Reviewer download URLs and Admin verification UI are
      not part of this slice.

paths:
  /live:
    get:
      tags: [operational]
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Reports only whether this process is alive. It performs no dependency
        check. A dependency outage must never make a healthy process restart.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResult'
              examples:
                alive:
                  value:
                    status: alive
                    service: core-api
                    version: 0.1.0

  /ready:
    get:
      tags: [operational]
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Reports whether this process can serve traffic. It checks critical
        startup state and critical dependencies only.

        Critical for core-api: configuration validity, PostgreSQL, and the Redis
        connections the request path needs.

        Explicitly NOT critical: the AI service, Qdrant, and any optional
        provider. Their failure reports `degraded` in `checks` while the overall
        status stays `ready` (ADR 0001 verification, gate G-02-04).
      security: []
      responses:
        '200':
          description: Ready to serve traffic. Optional dependencies may be degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'
              examples:
                readyWithDegradedAi:
                  summary: AI down, core still ready
                  value:
                    status: ready
                    service: core-api
                    version: 0.1.0
                    checks:
                      - name: configuration
                        critical: true
                        status: pass
                        duration_ms: 0
                      - name: postgresql
                        critical: true
                        status: pass
                        duration_ms: 3
                      - name: redis_cache
                        critical: true
                        status: pass
                        duration_ms: 1
                      - name: ai_service
                        critical: false
                        status: degraded
                        duration_ms: 250
        '503':
          description: Not ready. A critical dependency or configuration check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResult'

  /api/v1/meta/version:
    get:
      tags: [meta]
      operationId: getVersion
      summary: Build and version metadata
      description: Stable build metadata for client display and support triage.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Version metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VersionInfo'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/health:
    get:
      tags: [health]
      operationId: getPlatformHealth
      summary: Coarse platform health for client display
      description: |
        Client-facing health summary. Returns a localized human message in the
        language negotiated through `Accept-Language` (`ar` or `en`), satisfying
        the Phase 00 end-to-end requirement that each of the four clients can
        display core health and version in Arabic and English.

        This endpoint reports component status at a coarse granularity only. It
        never exposes hostnames, connection strings, versions of internal
        dependencies, or error details.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Health summary.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlatformHealth'
              examples:
                arabic:
                  summary: Arabic negotiation with AI degraded
                  value:
                    data:
                      status: degraded
                      message: بعض الخدمات الاختيارية غير متاحة حاليًا. الخدمات الأساسية تعمل.
                      components:
                        core: operational
                        realtime: operational
                        ai: unavailable
                      version: 0.1.0
                      server_time: '2026-08-24T19:05:00Z'
                    meta:
                      locale: ar
                    errors: []
                    request_id: 0199a5c8-1f2e-7c3a-9b41-2f6d0c5e7a10
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/diagnostics/round-trip:
    post:
      tags: [diagnostics]
      operationId: postDiagnosticsRoundTrip
      summary: Foundation round-trip slice
      description: |
        Phase 00 observable outcome. One authenticated request that exercises the
        full critical path and returns immediately:

          1. correlation ID assigned and propagated;
          2. request schema validated;
          3. idempotency record claimed;
          4. one bounded PostgreSQL transaction writes a synthetic diagnostics
             record and an `outbox_events` row atomically;
          5. commit;
          6. the outbox worker publishes the event post-commit;
          7. the trace and its redacted attributes reach the collector.

        The request never waits for the worker. `outbox_event_id` is returned so
        a test can assert the effect happened exactly once despite forced
        duplicate delivery.

        Carries no patient data of any kind. Gated by the server-owned feature
        flag `platform.diagnostics_slice`, which fails closed and is disabled
        outside local and development environments. When disabled the endpoint
        answers `404` so its existence is not disclosed.
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticsRoundTripRequest'
      responses:
        '201':
          description: |
            Round trip committed, or replayed from a prior identical request.

            A first request and an idempotent replay both answer 201. Inspect
            the `Idempotent-Replay` header to tell them apart.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DiagnosticsRoundTripResult'
        # NOTE: an idempotent replay does NOT get its own status code. The same
        # key with the same canonical request hash returns the ORIGINAL outcome,
        # status code included, so a retrying client receives exactly what it
        # would have received had the first response arrived. A replay is
        # signalled out of band by the `Idempotent-Replay: true` header and
        # `meta.idempotent_replay`, never by a different status.
        #
        # Branching on the status code to detect a replay is therefore wrong;
        # branch on the header.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Feature flag disabled. Existence is not disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/csrf:
    get:
      tags: [auth]
      operationId: createAuthCsrfCookie
      summary: Establish CSRF cookie for admin browser sessions
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: CSRF cookie issued. Admin login must send X-XSRF-TOKEN.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CsrfResult'

  /api/v1/auth/registrations:
    post:
      tags: [auth]
      operationId: registerAccount
      summary: Start patient registration
      description: |
        Always returns a generic OTP challenge. Does not disclose whether the
        phone or National ID already exists. Profile claim is a later phase and
        is flag-gated off.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: OTP required. Challenge id only; no tokens.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpChallengeResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/otp-requests:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Request an OTP for a declared purpose
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Generic OTP required envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpChallengeResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/otp-verifications:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Consume a one-time code
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerificationRequest'
      responses:
        '200':
          description: Restricted session, recovery continuation, or generic OTP envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginWithPassword
      summary: Password login
      description: |
        Enumeration-safe. Privileged actors receive an MFA challenge instead of
        a session. Admin cookie sessions use the adminSession scheme after MFA;
        device clients receive bearer material once.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Session, MFA challenge, or both according to actor class.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/mfa/challenges/{id}/verify:
    post:
      tags: [auth]
      operationId: verifyMfaChallenge
      summary: Complete a TOTP or recovery-code MFA challenge
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaChallengeVerifyRequest'
      responses:
        '200':
          description: Privileged session issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthSessionResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/auth/mfa/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTotp
      summary: Start self-service TOTP enrollment
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Provisioning URI once. Never logged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaEnrollResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/mfa/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: Confirm TOTP enrollment and issue recovery codes once
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Recovery codes shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaConfirmResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/auth/mfa/recovery-codes/rotate:
    post:
      tags: [auth]
      operationId: rotateMfaRecoveryCodes
      summary: Replace unused MFA recovery codes
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/auth/mfa/totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      summary: Disable the active TOTP factor
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/auth/recovery/requests/{id}/apply:
    post:
      tags: [auth]
      operationId: applyRecoveryRequest
      summary: Operator apply for manual_review recovery
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshDeviceToken
      summary: Rotate a device refresh token
      description: Reuse of a rotated refresh token revokes the family.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access and refresh material. Device clients only.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logoutCurrentSession
      summary: Revoke the current session
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listOwnSessions
      summary: List the caller's sessions
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Safe session metadata only.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [auth]
      operationId: revokeOwnSession
      summary: Revoke one of the caller's sessions
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/sessions/revoke-all:
    post:
      tags: [auth]
      operationId: revokeAllOwnSessions
      summary: Revoke every session for the caller
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/password/change:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change password and rotate credential version
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/auth/recovery/start:
    post:
      tags: [auth]
      operationId: startAccountRecovery
      summary: Start recovery OTP
      description: Generic envelope even when no account exists. Flag-gated.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryStartRequest'
      responses:
        '200':
          description: Generic OTP required envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OtpChallengeResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/recovery/complete:
    post:
      tags: [auth]
      operationId: completeAccountRecovery
      summary: Complete recovery with OTP and a new password
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCompleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthAck'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Current identity projection
      description: Never returns National ID, phone, password metadata, MFA secrets, or clinical content.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Identity handles and status only.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MeResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me/capabilities:
    get:
      tags: [identity]
      operationId: getMyCapabilities
      summary: Server-derived capabilities for the current actor
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Capability names derived from ActorContext.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CapabilitiesResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/patients/onboarding:
    post:
      tags: [patients]
      operationId: onboardPatientProfile
      summary: Create or resume the authenticated patient's demographic profile
      description: |
        Authenticated, phone-verified patient submits allowlisted demographics
        and a National ID. The server canonicalizes the identifier and computes
        a blind index. If no authoritative profile exists, one is created and
        attached to the caller. The successful body is compact (`status`,
        `patient_id`, `version`); `GET /api/v1/patients/me/profile` is the
        canonical projection. If an unlinked or conflicting profile exists, the
        Phase 01 claim boundary is invoked when eligible and the client always
        receives the same generic `manual_review_required` outcome. That
        outcome does not disclose whether a National ID is already known.

        `FEATURE_IDENTITY_PROFILE_CLAIM` remains off. Retries with the same
        Idempotency-Key replay the compact business result. The request cannot
        set ownership, status, version, or encryption metadata.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientOnboardingRequest'
      responses:
        '201':
          description: A new authoritative profile was created and linked. Body is compact.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientOnboardingResult'
        '200':
          description: |
            Idempotent replay of a compact own-profile result, retry of an
            already-linked caller, or generic `manual_review_required` for
            existing, owned, conflicting, or claim-disabled National IDs.
            Pending-phone callers remain 404.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientOnboardingResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/patients/me/profile:
    get:
      tags: [patients]
      operationId: getOwnPatientProfile
      summary: Current user's patient demographic projection
      description: |
        Server-derived from the authenticated user's attached profile.
        Never returns ciphertext, HMAC, key versions, National ID, or another
        patient's data. There is no GET-by-id patient profile API.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Own demographic projection.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/patients/me/demographics:
    patch:
      tags: [patients]
      operationId: updateOwnPatientDemographics
      summary: Update allowlisted demographic fields on the own profile
      description: |
        Optimistic `version` is required. Unknown JSON properties are rejected.
        Request bodies cannot change user_id, status, National ID protection
        metadata, ownership, audit fields, or version except as the expected
        current version for compare-and-set. Height and weight use named
        ENGINEERING_DEFAULT bounds and are rejected, never clamped.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientDemographicsPatchRequest'
      responses:
        '200':
          description: Updated own projection, including the new version.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/doctors/onboarding:
    post:
      tags: [doctors]
      operationId: onboardDoctorProfile
      summary: Create or resume the authenticated doctor's draft profile
      description: |
        Authenticated, phone-verified doctor submits allowlisted professional
        fields and a National ID. The server canonicalizes the identifier and
        computes a blind index. Optional syndicate identifiers are stored with
        the same Identity protection services. If no doctor profile exists for
        the caller, one draft, non-public, non-approved profile is created and
        attached. The successful body is compact (`status`, `doctor_id`,
        `version`); `GET /api/v1/doctors/me/profile` is the canonical
        projection. Collisions return the generic `manual_review_required`
        outcome without disclosing another doctor's identity or protected
        metadata.

        Creating a profile does not grant clinical capabilities or listing.
        Retries with the same Idempotency-Key replay the compact business
        result. The request cannot set ownership, verification state, public
        status, approval, suspension, version, or encryption metadata.
        Actor eligibility is server-derived from Identity/Access context.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorOnboardingRequest'
      responses:
        '201':
          description: A new draft doctor profile was created. Body is compact.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DoctorOnboardingResult'
        '200':
          description: |
            Idempotent replay of a compact own-profile result, retry of an
            already-linked caller, or generic `manual_review_required` for
            colliding National ID or syndicate identifiers. Pending-phone
            callers remain 404. Non-doctor account types remain 404.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DoctorOnboardingResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/doctors/me/profile:
    get:
      tags: [doctors]
      operationId: getOwnDoctorProfile
      summary: Current user's doctor profile projection
      description: |
        Server-derived from the authenticated user's attached doctor profile.
        Never returns ciphertext, HMAC, key versions, National ID, syndicate
        number, or another doctor's data. There is no GET-by-id doctor profile
        API. Verification case status is a separate own-resource endpoint.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Own doctor profile projection.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DoctorProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/doctors/me/verification-submissions:
    post:
      tags: [doctors]
      operationId: submitOwnDoctorVerification
      summary: Submit the current doctor's verification case
      description: |
        Moves a draft doctor verification case to `pending_review` when every
        required document metadata record is `available` with a clean scan.
        Server-derived actor only. Reviewer identity, document availability,
        and case status cannot be assigned by the client. Upload completion is
        not evidence of cleanliness. Idempotency-Key and optimistic
        case/profile versions are required.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorVerificationSubmissionRequest'
      responses:
        '200':
          description: Case submitted; pending review.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DoctorVerificationSubmissionResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/doctors/me/verification-status:
    get:
      tags: [doctors]
      operationId: getOwnDoctorVerificationStatus
      summary: Current user's doctor verification status
      description: |
        Own-case projection only. Never returns National ID, HMAC, syndicate
        identifiers, object storage keys, reviewer notes, or clinical data.
        Another doctor's case is not enumerable through this endpoint.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Own verification status projection.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DoctorVerificationStatusResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/verification-uploads:
    post:
      tags: [doctors]
      operationId: createOwnDoctorVerificationUpload
      summary: Create a doctor verification upload intent
      description: |
        Doctor-only. Creates an opaque upload intent for the caller's own draft
        `doctor_verification` case and a known requirement code. Returns a
        short-lived private upload grant. The client cannot choose object keys,
        scanner results, or lifecycle states. Idempotency-Key is required.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationUploadCreateRequest'
      responses:
        '201':
          description: Upload intent created with a bounded upload grant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerificationUploadCreateResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/verification-uploads/{upload_id}/complete:
    post:
      tags: [doctors]
      operationId: completeOwnDoctorVerificationUpload
      summary: Claim client upload completion so the server may observe the object
      description: |
        Completion is not evidence of size, MIME, hash, or malware cleanliness.
        The server inspects the stored object asynchronously. Duplicate complete
        calls are safe. Idempotency-Key is required. The body is a closed empty
        object.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: upload_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationUploadCompleteRequest'
      responses:
        '200':
          description: Completion accepted or already in progress.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerificationUploadStatusResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/verification-uploads/{upload_id}:
    get:
      tags: [doctors]
      operationId: getOwnDoctorVerificationUpload
      summary: Applicant-safe verification upload status
      description: |
        Own-upload projection only. Never returns object keys, buckets, signed
        URLs, hashes, scanner payloads, National ID, or reviewer information.
        Another doctor's upload ID is indistinguishable from missing.
      security:
        - deviceToken: []
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: upload_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Own upload status projection.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerificationUploadStatusResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque device access token issued after OTP or password+MFA for
        patient_mobile, doctor_desktop, and pharmacy_desktop. Stored hashed
        server-side. Never used by the admin browser.
    adminSession:
      type: apiKey
      in: cookie
      name: clinic_session
      description: |
        HTTP-only, Secure, SameSite session cookie for the React admin, paired
        with a CSRF token header. The admin never stores a bearer token in local
        storage. Device clients must not send this cookie as their credential.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Client-supplied correlation identifier. When absent the server assigns
        one. Always echoed in the response body and the `X-Request-Id` header.
      schema:
        $ref: '#/components/schemas/Uuid'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Cryptographically random key generated per user intent and reused only
        for retries of the identical request. Scoped server-side to the
        authenticated actor/device, the operation, and the tenant where
        applicable.
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: '^[A-Za-z0-9._~-]+$'

    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language negotiation. Supported tags are `ar` and `en`.
      schema:
        type: string
        default: en
        examples: ['ar', 'en', 'ar-EG', 'en-US']

    CursorParam:
      name: cursor
      in: query
      required: false
      description: |
        Opaque forward cursor from a previous response's `meta.pagination.next`.
        Cursors are signed when they carry state, size-bounded, and scoped to the
        filter, ordering, and actor that produced them. A cursor from a different
        filter, ordering, or actor is rejected with `422 CURSOR_INVALID`.
      schema:
        type: string
        maxLength: 512

    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  headers:
    XRequestId:
      description: Correlation identifier for this request.
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    IdempotentReplay:
      description: |
        Present and `true` when this response was replayed from a stored
        idempotency record rather than produced by a fresh transition. Absent on
        a first request. This is the only reliable way to distinguish the two:
        the status code is deliberately identical.
      required: false
      schema:
        type: string
        enum: ['true']

  schemas:

    # ---------------------------------------------------------------- scalars

    Uuid:
      type: string
      format: uuid
      description: UUIDv7 rendered as a string. Public APIs never expose sequential identifiers (ADR 0005).
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples: ['0199a5c8-1f2e-7c3a-9b41-2f6d0c5e7a10']

    Instant:
      type: string
      format: date-time
      description: |
        RFC 3339 / ISO-8601 instant with an explicit offset, always stored and
        transmitted in UTC. Never an ambiguous local date-time.
      examples: ['2026-08-24T19:05:00Z']

    TimeZoneId:
      type: string
      description: IANA time-zone identifier for scheduling intent. Never a fixed offset, because DST changes.
      examples: ['Africa/Cairo']

    Money:
      type: object
      description: Exact money. Integer minor units plus a currency code; never floating point (invariant 16).
      required: [amount_minor, currency]
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount in the currency's smallest unit. 12345 EGP minor units is 123.45 EGP.
        currency:
          type: string
          enum: [EGP]
          description: ISO 4217 code. V1 is Egypt only, but the field exists so a second country needs no rewrite (`plan.md` section 149).

    Quantity:
      type: object
      description: Exact quantity with an explicit unit. Never floating point.
      required: [value, unit]
      additionalProperties: false
      properties:
        value:
          type: integer
          format: int64
          description: Count in the smallest tracked unit.
        unit:
          type: string
          description: Identifier of the smallest tracked unit.
          maxLength: 32
          examples: ['tablet', 'vial', 'box']

    CountryCode:
      type: string
      enum: [EG]
      description: ISO 3166-1 alpha-2. Fixed to Egypt in V1.

    # ---------------------------------------------------------------- envelope

    Envelope:
      type: object
      description: |
        Every response uses this envelope (`plan.md` section 106). `data` carries
        the payload, `meta` carries pagination and negotiation information,
        `errors` is empty on success, and `request_id` correlates the request
        across logs, traces, and support conversations.
      required: [data, meta, errors, request_id]
      properties:
        data:
          description: Payload. `null` for operations with no return value.
        meta:
          $ref: '#/components/schemas/Meta'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          default: []
        request_id:
          $ref: '#/components/schemas/Uuid'

    ErrorEnvelope:
      type: object
      description: Failure envelope. `data` is null and `errors` has at least one entry.
      required: [data, meta, errors, request_id]
      properties:
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Error'
        request_id:
          $ref: '#/components/schemas/Uuid'

    Meta:
      type: object
      description: Response metadata. Never carries business payload.
      additionalProperties: true
      properties:
        locale:
          type: string
          enum: [ar, en]
        pagination:
          $ref: '#/components/schemas/CursorPagination'
        deprecation:
          $ref: '#/components/schemas/Deprecation'

    CursorPagination:
      type: object
      description: Cursor pagination for large or mutable collections. Offset pagination is not used.
      required: [has_more]
      additionalProperties: false
      properties:
        has_more:
          type: boolean
        next:
          type: [string, 'null']
          maxLength: 512
          description: Opaque cursor for the next page, or null when `has_more` is false.
        limit:
          type: integer
          minimum: 1
          maximum: 100

    Deprecation:
      type: object
      description: Present when the caller used a deprecated field or operation. Drives deprecation telemetry (ADR 0003).
      required: [message]
      properties:
        message:
          type: string
          maxLength: 500
        sunset_at:
          $ref: '#/components/schemas/Instant'

    Error:
      type: object
      description: |
        A single failure. Errors expose a stable machine code and a safe human
        message. They never expose a stack trace, SQL, an object key, a provider
        payload, or the existence of a protected resource.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 500
          description: Safe, localized, human-readable message. Never contains sensitive values.
        field:
          type: [string, 'null']
          maxLength: 200
          description: JSON pointer or dotted path for a field-level validation failure.
        meta:
          type: object
          description: Bounded, non-sensitive detail such as an allowed range.
          additionalProperties: true

    ErrorCode:
      type: string
      description: |
        Stable machine code. Clients branch on this, never on the message.

        Status mapping (phase file "API contract"):
          400 malformed protocol or input
          401 unauthenticated
          403 denied or CSRF mismatch
          404 hiding resource existence is safer
          409 state, version, or idempotency conflict
          422 field or business validation
          429 throttled
          5xx server or dependency failure
      enum:
        - MALFORMED_REQUEST
        - UNSUPPORTED_MEDIA_TYPE
        - REQUEST_TOO_LARGE
        - UNAUTHENTICATED
        - CSRF_MISMATCH
        - TOKEN_EXPIRED
        - PERMISSION_DENIED
        - NOT_FOUND
        - STATE_CONFLICT
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - VALIDATION_FAILED
        - CURSOR_INVALID
        - UNSUPPORTED_SCHEMA_VERSION
        - RATE_LIMITED
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR

    # ------------------------------------------------------------ operational

    LivenessResult:
      type: object
      required: [status, service, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [alive]
        service:
          type: string
          enum: [core-api, ai-service, reverb]
        version:
          type: string
          maxLength: 64

    ReadinessResult:
      type: object
      required: [status, service, version, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          enum: [core-api, ai-service, reverb]
        version:
          type: string
          maxLength: 64
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'

    ReadinessCheck:
      type: object
      required: [name, critical, status]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
          description: Stable check name. A bounded set, safe to use as a metric label.
        critical:
          type: boolean
          description: |
            When true, a failure makes the process not ready. Optional
            dependencies (AI service, Qdrant) are never critical for core-api.
        status:
          type: string
          enum: [pass, degraded, fail]
        duration_ms:
          type: integer
          minimum: 0

    # ------------------------------------------------------------------- meta

    VersionInfo:
      type: object
      required: [service, version, api_version]
      additionalProperties: false
      properties:
        service:
          type: string
          maxLength: 64
        version:
          type: string
          description: Semantic version of the running artifact.
          maxLength: 64
        api_version:
          type: string
          enum: ['v1']
        commit:
          type: [string, 'null']
          description: Short commit identifier of the built artifact.
          maxLength: 40
        built_at:
          $ref: '#/components/schemas/Instant'
        environment:
          type: string
          enum: [local, development, staging, production]

    PlatformHealth:
      type: object
      required: [status, message, components, version, server_time]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [operational, degraded, unavailable]
          description: |
            `degraded` means an optional component is unavailable while core
            capability remains. An AI outage is never a core outage
            (`plan.md` section 141).
        message:
          type: string
          maxLength: 300
          description: Localized human message in the negotiated language.
        components:
          type: object
          required: [core, realtime, ai]
          additionalProperties: false
          properties:
            core:
              $ref: '#/components/schemas/ComponentStatus'
            realtime:
              $ref: '#/components/schemas/ComponentStatus'
            ai:
              $ref: '#/components/schemas/ComponentStatus'
        version:
          type: string
          maxLength: 64
        server_time:
          $ref: '#/components/schemas/Instant'

    ComponentStatus:
      type: string
      enum: [operational, degraded, unavailable]

    # ------------------------------------------------------------ diagnostics

    DiagnosticsRoundTripRequest:
      type: object
      description: |
        Synthetic payload. Carries no personal or clinical data, and the server
        rejects any property not listed here, which also demonstrates the
        mass-assignment defence required by the threat model.
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          description: |
            Machine-generated slug identifying a test run. Lowercase, starts with
            a letter, no spaces, so it cannot carry a sentence. The server
            additionally rejects any run of 10 or more digits, which excludes
            Egyptian national IDs (14 digits) and mobile numbers (11 digits)
            embedded in an otherwise valid slug.
        echo_delay_ms:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: Requested artificial delay for the post-commit worker, used by timing tests.

    DiagnosticsRoundTripResult:
      type: object
      required: [diagnostics_id, outbox_event_id, committed_at, idempotent_replay]
      additionalProperties: false
      properties:
        diagnostics_id:
          $ref: '#/components/schemas/Uuid'
        outbox_event_id:
          $ref: '#/components/schemas/Uuid'
        committed_at:
          $ref: '#/components/schemas/Instant'
        idempotent_replay:
          type: boolean
          description: True when this response was replayed from a stored idempotency record.

    CsrfResult:
      type: object
      required: [csrf]
      additionalProperties: false
      properties:
        csrf:
          type: boolean

    RegistrationRequest:
      type: object
      required: [name, phone, national_id, password, language]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        national_id:
          type: string
          maxLength: 32
        password:
          type: string
          minLength: 12
          maxLength: 128
        language:
          type: string
