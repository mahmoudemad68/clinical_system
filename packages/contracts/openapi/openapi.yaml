      required:
        - doctor_id
        - profile_verification_status
        - profile_public_status
        - profile_version
        - case_id
        - case_status
        - case_version
        - case_type
        - submitted_at
        - decided_at
        - decision
        - reason_code
        - documents
      properties:
        doctor_id:
          $ref: '#/components/schemas/Uuid'
        profile_verification_status:
          $ref: '#/components/schemas/DoctorVerificationStatus'
        profile_public_status:
          $ref: '#/components/schemas/DoctorPublicStatus'
        profile_version:
          type: integer
          minimum: 1
        case_id:
          type: ['string', 'null']
          format: uuid
        case_status:
          type: ['string', 'null']
          enum: [draft, pending_review, changes_requested, approved, rejected, null]
        case_version:
          type: ['integer', 'null']
          minimum: 1
        case_type:
          type: ['string', 'null']
          enum: [doctor_verification, null]
        submitted_at:
          type: ['string', 'null']
          format: date-time
        decided_at:
          type: ['string', 'null']
          format: date-time
        decision:
          type: ['string', 'null']
          enum: [approved, rejected, changes_requested, null]
        reason_code:
          type: ['string', 'null']
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DoctorVerificationDocumentStatus'

    VerificationUploadCreateRequest:
      type: object
      additionalProperties: false
      required: [case_id, requirement_code, expected_size_bytes, declared_media_type]
      properties:
        case_id:
          $ref: '#/components/schemas/Uuid'
        requirement_code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
        expected_size_bytes:
          type: integer
          minimum: 1
          maximum: 20971520
        declared_media_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Optional client-declared digest. Server observation is authoritative.

    VerificationUploadCompleteRequest:
      type: object
      additionalProperties: false
      description: Empty closed object. Completion is not scan or availability evidence.
      properties: {}

    VerificationUploadStatusResult:
      type: object
      additionalProperties: false
      description: |
        Applicant-safe upload projection. Never includes object keys, buckets,
        signed URLs, hashes, scanner payloads, National ID, or reviewer data.
      required:
        - upload_id
        - requirement_code
        - state
        - rejection_reason
        - expires_at
        - completed_at
      properties:
        upload_id:
          $ref: '#/components/schemas/Uuid'
        requirement_code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
        state:
          type: string
          enum: [requested, uploading, quarantined, validating, scanning, available, rejected]
        rejection_reason:
          type: ['string', 'null']
          enum:
            - expired
            - object_missing
            - zero_byte
            - oversized
            - mime_mismatch
            - unsupported_format
            - malformed
            - malware_detected
            - toctou_mismatch
            - case_not_draft
            - processing_failed
            - null
        expires_at:
          $ref: '#/components/schemas/Instant'
        completed_at:
          type: ['string', 'null']
          format: date-time

    VerificationUploadCreateResult:
      type: object
      additionalProperties: false
      description: |
        Create response: applicant-safe status plus a one-time bounded upload
        grant. The grant URL is not persisted in later status GETs.
      required:
        - upload_id
        - requirement_code
        - state
        - rejection_reason
        - expires_at
        - completed_at
        - upload_target
      properties:
        upload_id:
          $ref: '#/components/schemas/Uuid'
        requirement_code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
        state:
          type: string
          enum: [requested, uploading, quarantined, validating, scanning, available, rejected]
        rejection_reason:
          type: ['string', 'null']
          enum:
            - expired
            - object_missing
            - zero_byte
            - oversized
            - mime_mismatch
            - unsupported_format
            - malformed
            - malware_detected
            - toctou_mismatch
            - case_not_draft
            - processing_failed
            - null
        expires_at:
          $ref: '#/components/schemas/Instant'
        completed_at:
          type: ['string', 'null']
          format: date-time
        upload_target:
          type: object
          additionalProperties: false
          required: [method, url, headers, expires_at]
          properties:
            method:
              type: string
              enum: [PUT]
            url:
              type: string
              format: uri
            headers:
              type: object
              additionalProperties:
                type: string
            expires_at:
              $ref: '#/components/schemas/Instant'

  responses:

    BadRequest:
      description: Malformed protocol or input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            malformed:
              value:
                data: null
                meta: { locale: en }
                errors:
                  - code: MALFORMED_REQUEST
                    message: The request body could not be parsed.
                request_id: 0199a5c8-1f2e-7c3a-9b41-2f6d0c5e7a10

    Unauthenticated:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Forbidden:
      description: |
        Authenticated but denied. The message is generic and identical for every
        denial reason so it cannot be used to probe permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotFound:
      description: Not found, or hidden because disclosing existence is unsafe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Conflict:
      description: |
        State, version, or idempotency conflict. `IDEMPOTENCY_KEY_REUSED` means
        the same key arrived with a different canonical request hash.
        `IDEMPOTENCY_IN_PROGRESS` means a concurrent duplicate is still
        processing; the caller polls rather than starting a second transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            keyReused:
              value:
                data: null
                meta: { locale: en }
                errors:
                  - code: IDEMPOTENCY_KEY_REUSED
                    message: This idempotency key was already used for a different request.
                request_id: 0199a5c8-1f2e-7c3a-9b41-2f6d0c5e7a10

    UnprocessableEntity:
      description: Field-level or business validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            validation:
              value:
                data: null
                meta: { locale: en }
                errors:
                  - code: VALIDATION_FAILED
                    message: The label may contain only letters, digits, spaces, underscores, and hyphens.
                    field: label
                request_id: 0199a5c8-1f2e-7c3a-9b41-2f6d0c5e7a10

    TooManyRequests:
      description: Throttled.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    InternalError:
      description: |
        Server or dependency failure. The body never contains a stack trace, SQL,
        an object key, or a provider payload. `request_id` is the only handle
        support needs to find the trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    AuthAck:
      description: Bounded acknowledgement with no secrets.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthAck'

security: []
