      enum: [draft, pending_review, changes_requested, approved, rejected, suspended]

    DoctorPublicStatus:
      type: string
      description: Server-owned directory visibility. New profiles are `hidden`.
      enum: [hidden, listed]

    DoctorOnboardingRequest:
      type: object
      required: [national_id, professional_display_name, specialty_id]
      additionalProperties: false
      properties:
        national_id:
