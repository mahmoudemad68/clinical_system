    PatientBloodType:
      type: string
      description: Self-reported ABO/Rh label. Not lab-verified.
      enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]

    PatientMaritalStatus:
      type: string
      description: ENGINEERING_DEFAULT closed vocabulary. Not a civil-status legal taxonomy.
      enum: [single, married, divorced, widowed]

    PatientOnboardingRequest:
      type: object
      required: [national_id, full_name, gender]
      additionalProperties: false
      properties:
        national_id:
          type: string
          maxLength: 32
          description: Write-only. Canonicalized server-side. Never echoed.
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        gender:
          $ref: '#/components/schemas/PatientGender'
        date_of_birth:
          type: [string, 'null']
          format: date
        height_cm:
          type: [number, 'null']
          minimum: 30
          maximum: 300
          description: ENGINEERING_DEFAULT storage bounds, not a clinical threshold. Values must also be greater than 0.
        weight_kg:
          type: [number, 'null']
          minimum: 1
          maximum: 700
          description: ENGINEERING_DEFAULT storage bounds, not a clinical threshold. Values must also be greater than 0.
        marital_status:
