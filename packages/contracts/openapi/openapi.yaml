        status:
          type: string
          enum: [quarantined, available, rejected, retired]
        uploaded_at:
          $ref: '#/components/schemas/Instant'

    DoctorVerificationStatusResult:
      type: object
      additionalProperties: false
      description: |
        Own-case verification projection. Never includes National ID, HMAC,
