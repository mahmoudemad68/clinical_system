        full_name:
          type: string
          minLength: 1
          maxLength: 200
        gender:
          $ref: '#/components/schemas/PatientGender'
        date_of_birth:
          type: [string, 'null']
          format: date
        height_cm:
          type: [number, 'null']
          minimum: 30
