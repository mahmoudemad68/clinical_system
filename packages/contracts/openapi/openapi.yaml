      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'

    MfaChallengeVerifyRequest:
      description: Exactly one of TOTP `code` or a single unused `recovery_code`. Never both.
      oneOf:
        - type: object
          required: [code]
          additionalProperties: false
          properties:
            code:
              type: string
              pattern: '^[0-9]{6}$'
        - type: object
          required: [recovery_code]
