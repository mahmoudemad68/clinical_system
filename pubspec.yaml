# Dart pub workspace root for the Flutter monorepo (plan.md section 4).
#
# Melos 8 requires its configuration here rather than in a separate melos.yaml,
# and uses Dart's native pub workspaces: every member declares
# `resolution: workspace` and shares this root's lockfile. One resolution across
# the workspace is the point — it makes a version conflict between two shared
# packages a bootstrap failure rather than a runtime surprise in one app.
#
# This file is NOT a Dart package. It exists only to define the workspace.

name: clinic_workspace
publish_to: none

environment:
  sdk: ^3.13.0

# G-06-01: SQLite3MultipleCiphers for clinic_local_database. Workspace-level
# user-defines are what the sqlite3 build hook actually reads when tests run
# from a member package.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# Melos 8 discovers the workspace by finding itself as a dev dependency of the
# root package alongside the `melos:` config section below.
dev_dependencies:
  melos: ^8.3.0

# Dart workspace members. Doctor and pharmacy desktops are deliberately absent:
# ADR 0010 moved them to Electron/React/TypeScript and they now live in the npm
# workspace. Only the patient mobile app and its shared Dart packages remain.
workspace:
  - apps/patient-app
  - packages/flutter/api_client
  - packages/flutter/authentication
  - packages/flutter/common_models
  - packages/flutter/design_system
  - packages/flutter/error_handling
  - packages/flutter/local_database
  - packages/flutter/localization
  - packages/flutter/networking
  - packages/flutter/notifications
  - packages/flutter/realtime
  - packages/flutter/secure_storage

melos:
  scripts:

    analyze:
      description: Static analysis across every package.
      run: melos exec -c 1 -- dart analyze --fatal-infos --fatal-warnings

    format:
      description: Format check. CI fails on unformatted code.
      run: melos exec -c 1 -- dart format --output=none --set-exit-if-changed .

    test:
      description: Run tests in every package that has any.
      run: melos exec -c 1 --dir-exists=test -- flutter test

    outdated:
      description: Report dependencies with newer versions available.
      run: melos exec -c 1 -- flutter pub outdated
