; Request and parser bounds. The phase file requires strict request/content-size
; limits and safe parsers as a mandatory Phase 00 control.
memory_limit=256M
post_max_size=12M
upload_max_filesize=10M
max_input_vars=200
max_execution_time=30
; Do not leak the PHP version in response headers.
expose_php=0
; Never render an error into a response body; errors go to the log and the
; client sees the stable envelope with a request_id.
display_errors=0
display_startup_errors=0
log_errors=1
error_log=/dev/stderr
; Bound deserialization depth for untrusted JSON.
serialize_precision=-1
zend.exception_ignore_args=1
zend.exception_string_param_max_len=0
