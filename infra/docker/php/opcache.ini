; OPcache for a long-lived Octane worker.
; validate_timestamps=0 is safe here because the image is immutable: code never
; changes under a running container (ADR 0008, build once and promote).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=128M
