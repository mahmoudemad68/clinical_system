# Prometheus — clinic platform local and staging scrape configuration.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    platform: clinic

rule_files:
  - /etc/prometheus/alerts/*.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: core-api
    metrics_path: /metrics
    static_configs:
      - targets: ['core-api:8080']

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-service:8001']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
