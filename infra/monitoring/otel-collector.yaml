# OpenTelemetry Collector — clinic platform.
#
# The collector is the last place redaction can happen before telemetry leaves
# the trust boundary. The application redacts at the source (PatternRedactor);
# this is defence in depth for anything a library emits that the application
# never saw.
#
# Phase 00 §7.5 requires proving that traces and logs from a synthetic
# clinical-looking request are redacted before leaving the process.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Bound the payload. An unbounded receiver is a memory-exhaustion
        # vector reachable by anything that can dial the port.
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory before anything else runs. Without this the collector will
  # happily OOM under a traffic spike and take the telemetry pipeline down at
  # exactly the moment it is most needed.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  # ------------------------------------------------------------- redaction
  #
  # Deny-list of attribute keys that must never leave the process, matched
  # case-insensitively. This mirrors PatternRedactor::SENSITIVE_KEYS; the two
  # are kept in step by a test that compares them.
  attributes/redact:
    actions:
      - key: db.statement
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: national_id
        action: delete
      - key: nationalId
        action: delete
      - key: phone
        action: delete
      - key: email
        action: delete
      - key: password
        action: delete
      - key: token
        action: delete
      - key: otp
        action: delete
      - key: clinical_note
        action: delete
      - key: diagnosis
        action: delete
      - key: prescription_text
        action: delete
      - key: lab_result
        action: delete
      - key: object_key
        action: delete
      - key: signed_url
        action: delete
      - key: prompt
        action: delete
      - key: completion
        action: delete
      - key: card_number
        action: delete

  # Value-level scrubbing for anything that slipped through as free text.
  # Key matching cannot catch a national ID typed into a span description.
  transform/redact_values:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Egyptian national ID: 14 digits.
          - replace_pattern(name, "\\b[0-9]{14}\\b", "[redacted:national_id]")
          # Egyptian mobile.
          - replace_pattern(name, "\\b01[0125][0-9]{8}\\b", "[redacted:phone]")
          # Bearer tokens and JWTs.
          - replace_pattern(name, "eyJ[A-Za-z0-9_.-]{20,}", "[redacted:jwt]")

  # Metric labels are bounded. The phase file forbids patient, doctor,
  # appointment, file, prescription, or free-text values as labels, because
  # label cardinality is unbounded and retained far longer than log bodies.
  attributes/bound_metric_labels:
    actions:
      - key: patient_id
        action: delete
      - key: doctor_id
        action: delete
      - key: appointment_id
        action: delete
      - key: prescription_id
        action: delete
      - key: file_id
        action: delete
      - key: user_id
        action: delete

  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Resource attributes as labels would reintroduce unbounded cardinality.
    resource_to_telemetry_conversion:
      enabled: false

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resourcedetection
        - attributes/redact
        - transform/redact_values
        - batch
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resourcedetection
        - attributes/bound_metric_labels
        - batch
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - attributes/redact
        - batch
      exporters: [debug]
